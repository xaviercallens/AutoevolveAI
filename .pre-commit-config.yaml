repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-q", "-ll"]

  - repo: local
    hooks:
      - id: antigravity-hardened-gate
        name: Antigravity Hardened Quality Gate
        entry: python .antigravity/hooks/hardened_gate.py
        language: system
        types: [python]
        pass_filenames: true
      - id: anti-simulation-guard
        name: Anti-Simulation & Attestation Guard
        entry: python execution_attestation.py
        language: system
        pass_filenames: false

