  # ─────────────────────────────────────────────────────────────────────
  # PHASE 5 — Claude Code hardening parity with the Antigravity pipeline.
  # ─────────────────────────────────────────────────────────────────────

  - id: P5-1
    title: "Strengthen post-edit stub and fake-data detection"
    phase: 5
    tier: low
    depends_on: []
    read_first: [.claude/hooks/post_edit_verify.py, execution_attestation.py]
    edit: [.claude/hooks/post_edit_verify.py]
    create: [tests/remediation/test_post_edit_verify.py]
    spec:
      - "Two gaps vs the Antigravity side. First: post_edit_verify.py:22-23 flags a stub only when it is the SOLE statement in a body, while execution_attestation.py's ImplementationAuditor flags a pass/... anywhere in a body. Match the stricter rule."
      - "Second: post_edit_verify.py has no mock_/fake_/MagicMock detection at all. Port the rules from execution_attestation.py:92-105 — flag mock_/fake_/dummy_ prefixed names and Mock/MagicMock usage in non-test files."
      - "Keep the existing exemption logic correct: files under tests/ are exempt from the fake-data rule (the project rules permit test doubles there), but NOT from the syntax check."
      - "Keep the hook stdlib-only. It runs under system python3 (3.10) per .claude/settings.json:23, so no venv imports and no walrus-free-only syntax concerns beyond 3.10."
      - "Exit 2 with the file:line and rule name on violation, matching the current output shape so existing behaviour is not surprising."
    tests:
      - "A function with a docstring, a real statement AND a stray `pass` is now flagged (it was not before); assert exit code 2 and that the message names the line."
      - "A non-test file defining mock_client is flagged; the same file under tests/ is not — assert both outcomes."
      - "A clean file still exits 0; assert the exit code and empty stderr."
      - "A syntax error in a tests/ file is still flagged; assert exit 2 (the tests/ exemption must not cover syntax)."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_post_edit_verify.py -q -p no:cacheprovider"

  - id: P5-2
    title: "Harden the bash guard's bypassable regexes"
    phase: 5
    tier: low
    depends_on: []
    read_first: [.claude/hooks/pre_bash_guard.py]
    edit: [.claude/hooks/pre_bash_guard.py]
    create: [tests/remediation/test_pre_bash_guard.py]
    spec:
      - "pre_bash_guard.py:8-14 matches literal strings and is trivially evaded. Known gaps: `git -c <anything> push --force`, `git push origin +main` (the + refspec is a force push), `env GIT_...` prefixes, and `rm -rf /home/...` (the current pattern matches bare / only)."
      - "Add patterns for: refspec force pushes (+branch), `git -c` wrappers before a blocked subcommand, and rm -rf against any absolute path outside /tmp — err toward blocking; a false positive costs one clarification, a false negative costs a repository."
      - "Keep the existing five rules working; this card only adds coverage."
      - "Do not attempt to make the guard bulletproof against a determined bypass — it cannot be, and the card should not claim it is. Document that in the module docstring: this stops accidents, not adversaries."
    tests:
      - "Each new bypass form is blocked: assert exit 2 for `git push origin +main`, for `git -c core.hooksPath=/dev/null push --force`, and for `rm -rf /home/user/x` — three assertions."
      - "Benign commands still pass: `git push`, `rm -rf /tmp/scratch`, `git commit -m 'fix pass'` — assert exit 0 for each."
      - "Hypothesis: any command containing `--no-verify` as a whole word is blocked regardless of surrounding text."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_pre_bash_guard.py -q -p no:cacheprovider"

  - id: P5-3
    title: "Add the missing Stop hook"
    phase: 5
    tier: mid
    depends_on: [P5-1]
    read_first: [.claude/settings.json, .agents/scripts/stop_attestation_check.py]
    create: [.claude/hooks/stop_completion_check.py, tests/remediation/test_stop_hook.py]
    edit: [.claude/settings.json]
    spec:
      - "THE LARGEST HARDENING GAP. Antigravity has a Stop hook (.agents/hooks.json -> stop_attestation_check.py) that runs an anti-stub audit at turn end. Claude Code has none: a turn can end claiming completion with zero gate."
      - "Create .claude/hooks/stop_completion_check.py: on Stop, audit the files changed in this session (git diff --name-only HEAD plus git status --porcelain) for stubs and fake-data markers, reusing P5-1's rules."
      - "Do NOT copy the Antigravity script's failure mode: stop_attestation_check.py:70-71 wraps its whole audit in `except Exception: pass`, so any git hiccup silently passes. Let unexpected errors surface."
      - "Do NOT wire in execution_attestation.py's PROOF_TOKEN. That token is forgeable (see P5-5) and CLAUDE.md:28 scopes it to Antigravity. This hook checks the code, not a token."
      - "Return the Stop hook's documented JSON shape. A blocking decision must carry a reason the model can act on."
      - "Register it under a Stop matcher in .claude/settings.json alongside the existing PreToolUse/PostToolUse entries."
      - "Mid tier: a hook that can block turn completion — a wrong rule here is disruptive on every turn."
    tests:
      - "A session diff containing a stubbed function produces a blocking decision naming the file; assert the decision field and the filename."
      - "A clean diff allows the stop; assert the non-blocking decision."
      - "A git failure surfaces rather than silently passing: patch subprocess to raise and assert the exception is not swallowed (pytest.raises)."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_stop_hook.py -q -p no:cacheprovider"
      - ".venv/bin/python -c \"import json,pathlib; h=json.loads(pathlib.Path('.claude/settings.json').read_text())['hooks']; assert 'Stop' in h, sorted(h)\""

  - id: P5-4
    title: "Run the full static pipeline on edited files"
    phase: 5
    tier: mid
    depends_on: [P5-1]
    read_first: [.antigravity/hooks/hardened_gate.py]
    create: [.claude/hooks/post_edit_static.py, tests/remediation/test_post_edit_static.py]
    edit: [.claude/settings.json]
    spec:
      - "Antigravity's hardened_gate.py runs Ruff (:87), Bandit (:93), Vulture (:100), MyPy (:107) and Radon CC<=10 (:40-55). The Claude Code side runs none of them."
      - "Add a PostToolUse hook that runs ruff, bandit and radon CC on the single edited file. All three are installed in .venv."
      - "Scope to the edited file only. A whole-repo gate on every edit is unusable, and the repo currently has pre-existing failures that would block all work: antigravity_guard.py reports hallucinated imports (z3, matplotlib, pymilvus, sentence_transformers, rl_common, arxiv) and an f-string syntax error in scripts/generate_analysis_report.py."
      - "This hook needs .venv/bin/python, not system python3 — unlike the existing stdlib-only hooks. Resolve it via $CLAUDE_PROJECT_DIR and degrade gracefully (warn, exit 0) if the venv is absent, so a fresh clone is not bricked."
      - "MyPy is deliberately excluded: pyproject.toml:70 sets python_version = \"10.0.0\", which is invalid and must be fixed by P6-5 first."
      - "Mid tier: a hook on the hot edit path with a real latency budget — keep it under a couple of seconds per file."
    tests:
      - "A file with CC > 10 is flagged; assert exit 2 and that the function name appears in the message."
      - "A file with a bandit high-severity finding is flagged; a file with only a low-severity informational finding is not — assert both."
      - "A missing .venv degrades to exit 0 with a warning rather than blocking; assert the exit code and that stderr mentions the venv."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_post_edit_static.py -q -p no:cacheprovider"

  - id: P5-5
    title: "Decide the fate of the forgeable attestation token"
    phase: 5
    tier: human
    depends_on: []
    read_first: [execution_attestation.py]
    spec:
      - "execution_attestation.py:258-277 mints the PROOF_TOKEN as blake2b('ANSE:attestation:v1:' + HEAD)[:32] then sha256(key + target_module). It is deterministic, derived from public repository state, and uses no secret. Anyone with the repo can compute any token, and main()'s verify mode (:301-320) recomputes with the same public key — so verification proves nothing."
      - "The receipt path is redirectable via ANSE_ATTESTATION_PATH (:18), and .antigravity_attestation is a plain writable tracked file with no signature."
      - "Decide one of: (a) mint with an HMAC over a secret held outside the repo, making the token meaningful; (b) drop the token and rely on the deterministic code audits, which are the part that actually works; (c) keep it explicitly as a process ritual and remove every claim that it is cryptographic proof."
      - "Option (b) is the honest default — the audit portion of execution_attestation.py (AST stubs at :61-87, mock detection at :92-105, coverage check at :142-197) is genuinely useful; only the token ceremony is theatre."
      - "Whatever you choose, .antigravity/rules.md §6.2 currently calls it 'a cryptographically signed nonce'. That wording must match reality."
      - "Human tier: a decision about a project-wide contract, plus possibly a secret."
    accept: []

  - id: P5-6
    title: "Stop the workflow verifier from executing model-supplied shell"
    phase: 5
    tier: mid
    depends_on: []
    read_first: [claude_workflow.py, mcp_claude_workflow.py]
    edit: [claude_workflow.py]
    create: [tests/remediation/test_workflow_verifier.py]
    spec:
      - "claude_workflow.py:150 runs the acceptance_command with shell=True, and that command came from the model via plan_decompose_task. The 'black-box external verification gate' therefore executes whatever the model wrote — self-certification is one `exit 0` away."
      - "This mirrors the card-workflow rule that this very file set is built on: accept commands are run by the driver, never trusted from the model."
      - "Require acceptance commands to come from an allowlist of shapes (pytest invocations, py_compile, the repo's own guard scripts) and reject anything else with a clear message. Parse with shlex and run without shell=True."
      - "Reject command chaining outright (;, &&, ||, backticks, $()) — an allowlisted prefix followed by arbitrary shell is not allowlisted."
      - "Once the allowlist is enforced, declare mcp_claude_workflow.py as a second server in .mcp.json (card P0-7 deliberately left it out until now, because declaring it earlier would expose the shell=True path this card closes). Its three tools — plan_decompose_task, get_current_subtask_context, submit_subtask_for_verification — are unreachable from Claude Code until then."
      - "Mid tier: a security boundary with an existing caller contract."
    tests:
      - "An allowlisted pytest command runs; assert it was invoked with a list argv and shell=False — two assertions."
      - "`pytest x && curl evil.example` is rejected; assert the refusal and that no subprocess was spawned."
      - "A bare `exit 0` is rejected; assert the message names the allowlist."
      - "Hypothesis: no input containing a shell metacharacter is ever executed."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_workflow_verifier.py -q -p no:cacheprovider"

  - id: P5-7
    title: "Make `v2_tasks.py done` verify before it records"
    phase: 5
    tier: low
    depends_on: [P0-2]
    read_first: [tools/v2_tasks.py]
    edit: [tools/v2_tasks.py]
    create: [tests/remediation/test_v2_tasks_done_verifies.py]
    spec:
      - "tools/v2_tasks.py `done` appends the id to status.json without running anything, while its own docstring says to use it 'only after every accept command passed'. That is the same class of defect as P1-5: a record of success that verifies nothing."
      - "Make `done <ID>` run the card's accept commands and refuse to record unless all exit 0. Print each command's exit code."
      - "Human-tier cards have accept: [] by convention. For those, require an explicit --human-confirmed flag so the empty list cannot silently auto-pass."
      - "Add --force for the genuine override case, and make it print a loud warning naming the card. An override that leaves no trace is indistinguishable from a bug."
      - "Run accept commands with shell semantics matching the driver's documented contract, but never from the card-executing model's output — the commands come from the YAML, which is reviewed."
    tests:
      - "A card whose accept command exits 1 is NOT recorded; assert status.json is unchanged and the exit code is non-zero."
      - "A card whose commands all pass IS recorded; assert the id appears in status.json."
      - "A human-tier card without --human-confirmed is refused; with the flag it records — assert both."
      - "--force records despite a failing command and emits a warning naming the card; assert both."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_v2_tasks_done_verifies.py -q -p no:cacheprovider"

  # ─────────────────────────────────────────────────────────────────────
  # PHASE 6 — Reconcile published claims with reproducible evidence.
  # Added on the 2026-09-25 decision to card these rather than only
  # report them.
  # ─────────────────────────────────────────────────────────────────────

  - id: P6-1
    title: "Figures must come from real runs or not render at all"
    phase: 6
    tier: mid
    depends_on: [P4-4]
    read_first: [scripts/generate_phd_paper_figures.py]
    edit: [scripts/generate_phd_paper_figures.py]
    create: [tests/remediation/test_figures_require_real_data.py]
    spec:
      - "scripts/generate_phd_paper_figures.py:199-202 synthesises the published loss curve as initial_loss*(1 - 0.201*(1 - exp(-e/5))) plus np.random.normal noise and writes it into fig3_dpo_reward_margins_and_loss_reduction.pdf. This is fabricated data inside a publication artifact."
      - "Delete the synthesis. Read the loss series from a real run's artifacts (P4-4 produces them) and raise FabricatedResultError when none exists. A missing figure is a correct outcome when there is no run behind it."
      - "Audit the sibling scripts for the same pattern before finishing: scripts/generate_3_phd_paper_figures.py and scripts/generate_paper_figures.py. Report what you find; fix the same defect wherever it appears."
      - "Every figure must be traceable: stamp the source artifact path and the run id into the figure caption or an adjacent .json sidecar, so a reader can check it."
      - "Mid tier: touches publication output and needs judgement about what counts as a real source."
    tests:
      - "With no run artifacts present, generating the figure raises FabricatedResultError and writes NO pdf — assert both the exception and the absent file."
      - "With a fixture run artifact, the rendered series equals the artifact's series exactly (assert element-wise), and no np.random call occurs (patch np.random.normal and assert not called)."
      - "Assert the synthesis formula is gone: the module source must not contain '0.201' or 'np.random.normal' in the figure-data path."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_figures_require_real_data.py -q -p no:cacheprovider"

  - id: P6-2
    title: "Reconcile the -20.1% loss-reduction claim with the measured -4.52%"
    phase: 6
    tier: low
    depends_on: []
    read_first: [scripts/build_phd_200_paper.py, results/redis_lora_execution_report.json]
    spec:
