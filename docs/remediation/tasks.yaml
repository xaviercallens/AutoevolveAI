  - id: P4-1
    title: "Make the harvester actually write its episode log"
    phase: 4
    tier: mid
    depends_on: [P3-4]
    read_first: [anse/memory/harvester.py, anse/config.py, anse/jepa/dataset.py]
    create: [tests/remediation/test_harvester_jsonl.py]
    spec:
      - "anse/config.py:263 points the harvester at data/interactions.jsonl. That file has never been written — only the Chroma side of the harvester has ever run. anse/jepa/dataset.py:10 reads exactly that file, which is why the most genuine trainer in the repo (anse/jepa/, real AdamW and loss.backward() at trainer.py:132-136, CPU-viable) has never had data."
      - "Find why the JSONL write does not happen (anse/memory/harvester.py:71 onward) and fix it so every captured trace appends a record. Report the root cause in the card report — if the write is simply never called, say so."
      - "Record schema per line: task id, prompt, completion, verdict, energy, timestamp, latent (1024-d, per P3-5). Write atomically (temp file + rename) so a crash mid-write cannot corrupt the log."
      - "Do not backfill from the 21 existing Chroma embeddings unless their source records are recoverable — a reconstructed episode is not an observed one."
      - "Mid tier: requires diagnosing why an existing path is dead."
    tests:
      - "Harvesting two traces against a tmp_path config appends exactly two lines, each valid JSON with every required field — assert the count and the field set."
      - "A crash between write and rename leaves no partial line: simulate by patching rename to raise, then assert the destination file is unchanged."
      - "The latent, when present, is 1024-d; assert the length and that a wrong-dimension latent is rejected rather than padded."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_harvester_jsonl.py -q -p no:cacheprovider"

  - id: P4-2
    title: "One verified-data gate that every trainer must pass through"
    phase: 4
    tier: mid
    depends_on: [P1-5, P4-1]
    create: [anse/curator/verified_dataset.py, tests/remediation/test_verified_dataset.py]
    spec:
      - "The verified-only gate EXISTS and is correct on the designed path: harvest_delta.py:85-93,113 and harvest_training_pipeline.py:91-113 filter on verdict == 'PASSED'; extract_dpo_pairs.py:99-111 does the same. But the ONE script that has actually run bypasses it: scripts/execute_local_redis_ltm_lora.py:159 pulls raw conversation turns filtered only by string length (>15/>20 chars). grep for verdict|PASSED|attestation in that file returns zero hits. Same for scripts/train_qwen_lora.py and pod/train_lora_pod.py."
      - "Create anse/curator/verified_dataset.py as the single chokepoint: build_sft_dataset(rows) and build_dpo_dataset(rows) that accept only rows carrying an attestation verdict of PASSED, and raise UnverifiedDataError listing the rejected ids otherwise."
      - "Per project rule (.antigravity/rules.md §8.5): only hidden-test-verified solutions may enter lesson memory, DPO pairs or any fine-tuning set. This module is that rule in code."
      - "Route execute_local_redis_ltm_lora.py, train_qwen_lora.py and pod/train_lora_pod.py through it. Do not leave a second path open — the point of a chokepoint is that there is one."
      - "Also reject the 1-line fixture rows currently in training_runs/datasets/delta_*.jsonl (e.g. content 'Implement binary search.' / 'return 0', trace_id tr_001, timestamp 50.0). A minimum-rows threshold is not enough; check for the fixture trace_ids explicitly and refuse."
      - "Mid tier: changes the contract of three existing trainers."
    tests:
      - "A mix of PASSED and FAILED rows yields only the PASSED ones; assert the count and that a known FAILED id is absent."
      - "Rows with no verdict field at all raise UnverifiedDataError; assert the message lists the offending ids."
      - "The known fixture rows are rejected even if labelled PASSED; assert the refusal names them."
      - "Hypothesis: build_sft_dataset output length is always <= input length, and every output row has verdict PASSED — assert both invariants."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_verified_dataset.py -q -p no:cacheprovider"

  - id: P4-3
    title: "Rebuild the dream LoRA trainer on real episodes"
    phase: 4
    tier: mid
    depends_on: [P1-4, P4-2, P2-1]
    read_first: [anse/autopoiesis/dream_lora_trainer.py, train_checkpoint.py]
    create: [tests/remediation/test_dream_trainer_inputs.py]
    spec:
      - "anse/autopoiesis/dream_lora_trainer.py has a genuine optimizer/backward loop but trains on fabricated tensors: input_ids = torch.randint(...) at :111-115, with a :100 comment reading 'Dummy loop'. The adapter is never saved (:163 'theoretically saved'). It is dead regardless: `from rl_common import` at :27 does not resolve, and checkpoints/laya does not exist."
      - "Either rebuild it on P4-2's verified dataset, or delete it and extend train_checkpoint.py (which already has real QLoRA: bnb NF4 + SFTTrainer at :222-256). PREFER extending train_checkpoint.py — this repo does not need a second trainer, and the existing one is correct."
      - "CORRECTED 2026-09-25: rl_common is NOT a hallucinated import. The module is real and lives in the data lake; `scripts/bootstrap_from_datalake.py --only code` vendors it to vendor/laya/rl_common.py (19,139 B, defines load_cfg and DecisionModel — the exact two names dream_lora_trainer.py:27 imports). Vendor it and fix the import path; do NOT delete the import as an earlier version of this card said."
      - "The adapter must actually be written to disk: adapter_model.safetensors must exist when the run reports success. No weight file exists in this checkout (the lake has 0.5B ones; see P4-8)."
      - "Check VRAM via P2-1 before loading; refuse with a clear message rather than OOMing. The T4 has 15,360 MiB and the base model is Qwen2.5-Coder-7B-Instruct (train_checkpoint.py:68) — note anse/config.py:34 defaults load_in_4bit to False, which will not fit."
      - "Fix train_grpo.py:29 while you are here if you touch it: check_has_stubs substring-matches 'pass', so 'password', 'bypass' and 'passed' all trigger a false stub penalty. Use word boundaries or AST."
      - "Mid tier: a build-or-delete judgement and a real training path."
    tests:
      - "The trainer refuses a dataset that did not come through P4-2 — assert pytest.raises(UnverifiedDataError)."
      - "With VRAM patched below the estimated footprint, the trainer refuses before loading the model; assert the exception and that no model load was attempted (patch the loader and assert not called)."
      - "Assert torch.randint no longer appears in the training-input path: inspect.getsource of the batch-building function must not contain 'randint'."
      - "Assert the dead import is gone: 'rl_common' not in the module source."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_dream_trainer_inputs.py -q -p no:cacheprovider"

  - id: P4-4
    title: "Execute one real QLoRA run and record its true loss curve"
    phase: 4
    tier: human
    depends_on: [P0-3, P4-3]
    spec:
      - "This is the card that proves the stack works. Run ONE QLoRA fine-tune on the T4 over a P4-2-verified dataset, and keep every artifact: the step-by-step loss, the adapter weights, the dataset hash, the base model id, and the wall-clock duration."
      - "Success is not 'loss went down'. Success is: adapter_model.safetensors exists, the loss series came from the trainer's own logs, and the run is reproducible from the recorded dataset hash. A run whose loss rose is a valid result and must be reported as one."
      - "Context for honesty: the only previous real run on disk (results/redis_lora_execution_report.json) was 0.5B over 8 steps with loss 3.532 -> 3.692 — it rose 4.52% — and was labelled \"status\": \"SUCCESS\". Do not repeat that."
      - "Write the artifacts where P6-1 can find them; the figure pipeline will be rebuilt to read real runs only."
      - "Human tier: hours of GPU time and a judgement about whether the result is worth keeping."
    accept: []

  - id: P4-5
    title: "Promotion gate with measured no-regression and rollback"
    phase: 4
    tier: mid
    depends_on: [P4-4]
    create: [anse/autopoiesis/adapter_promotion.py, tests/remediation/test_adapter_promotion.py]
    spec:
      - "Implement the Night School promotion rule from docs/ROADMAP_V1_V2_COMPANION.md §4: promote a new adapter only if it beats the incumbent on a frozen eval set AND regresses nothing on a personal regression set; otherwise keep yesterday's and write a report."
      - "promote(candidate: AdapterRef, incumbent: AdapterRef, results: EvalResults) -> PromotionDecision, a frozen dataclass carrying promoted: bool, reason: str, and the per-metric deltas."
      - "Rollback via symlink: an 'active' symlink points at the promoted adapter directory; rolling back is repointing it. Never mutate an adapter directory in place."
      - "Refuse to promote an adapter with no adapter_model.safetensors, reusing P1-5's rule. The two cards enforce the same invariant at different layers, deliberately."
      - "A tie is not an improvement — require a strictly better primary metric, and say so in the reason string."
      - "Mid tier: a policy decision expressed in code, with a destructive symlink operation."
    tests:
      - "A candidate better on the primary metric with no regression promotes: assert promoted True and that the symlink now resolves to the candidate — two assertions."
      - "A candidate better on primary but regressed on the regression set does NOT promote; assert promoted False and that the symlink still resolves to the incumbent."
      - "A tie does not promote; assert False and that the reason mentions the tie."
      - "A candidate directory without safetensors raises; assert the exception type."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_adapter_promotion.py -q -p no:cacheprovider"

  - id: P4-6
    title: "Schedule the night run — last, not first"
    phase: 4
    tier: human
    depends_on: [P4-4, P4-5, P1-5, P1-6]
    spec:
      - "ONLY after P4-4 has produced one real run and P1-5/P1-6 have closed the DRY_RUN laundering path. Scheduling before that automates the production of unbacked results."
      - "systemd timer at 01:00 per ROADMAP §4, with a GPU-idle precondition: skip the run rather than contend with interactive work. Use P0-4's --require-gpu as the precondition check — if the driver is missing after a kernel upgrade, the job must fail visibly, not silently train on CPU."
      - "Send the run report somewhere a human sees it. A nightly job whose failures are invisible is a nightly job that stops working without anyone noticing."
      - "Note the existing precedent on this host: datalake-harvest-daemon.service runs under ~/venv/bin/python (3.10), NOT the repo .venv (3.11). Pin the interpreter explicitly in the unit file."
      - "scripts/nightly_dream_phase.py is the existing trigger and is currently unreferenced by any crontab or timer; it would abort at :31-33 because .scratchpad/hippocampus_replay.jsonl does not exist. Decide whether to fix or replace it."
      - "Human tier: a system service that spends GPU hours unattended."
    accept: []

