  # ─────────────────────────────────────────────────────────────────────
  # PHASE 3 — Long-term memory: Redis for the hot path, GCS for durability.
  # ─────────────────────────────────────────────────────────────────────

  - id: P3-1
    title: "Add the GCS dependency and a typed storage client"
    phase: 3
    tier: low
    depends_on: [P0-5]
    create: [anse/infrastructure/gcs_backup.py, tests/remediation/test_gcs_backup.py]
    edit: [pyproject.toml]
    spec:
      - "No GCS code exists in the repo: zero hits for google.cloud, storage.Client, gs://, GOOGLE_APPLICATION_CREDENTIALS. google-cloud-storage is not installed and not declared."
      - "Add a new optional-dependency extra to pyproject.toml: backup = [\"google-cloud-storage>=2.18\"]. Do not add it to an existing extra — the guards read those lists to decide what may be imported."
      - "Create anse/infrastructure/gcs_backup.py: GcsBackup(bucket: str, prefix: str, client: object | None = None) with upload_file(local: Path, remote_name: str) -> str returning the gs:// URI, download_file(remote_name: str, local: Path) -> Path, and list_backups(limit: int = 50) -> list[str] newest first."
      - "Inject the storage client so tests never touch the network. Import google.cloud.storage lazily inside the constructor so the module imports without the extra installed."
      - "Raise a named error (reuse UnverifiedDataError or add BackupError to anse/infrastructure/fabrication.py) when an upload reports success but a subsequent existence check fails. A backup that was not verified to exist is not a backup."
      - "Credentials: rely on the host's application-default service account (1003063861791-compute@developer.gserviceaccount.com, project gen-lang-client-0625573011). Do NOT write a key file into the repo and do not add credentials to any config that is committed."
    tests:
      - "With an injected fake client (defined in the test file — this is a test double, which the rules permit inside tests/), assert upload_file returns the correct gs:// URI and that the blob name includes the prefix — two assertions."
      - "Assert the post-upload existence check runs and that a client reporting the blob absent raises the named error (pytest.raises with match)."
      - "list_backups returns newest first: inject three blobs with known timestamps and assert the exact order."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_gcs_backup.py -q -p no:cacheprovider"
      - ".venv/bin/python -c \"import tomllib,pathlib; d=tomllib.loads(pathlib.Path('pyproject.toml').read_text()); assert 'backup' in d['project']['optional-dependencies']\""

  - id: P3-2
    title: "Choose the backup bucket, lifecycle and service-account scope"
    phase: 3
    tier: human
    depends_on: [P3-1]
    spec:
      - "28 buckets are visible to this host's service account, including gs://socrateai-datalake-..., gs://gen-lang-client-0625573011-agora-checkpoints and gs://symbrain-v12-results. Decide which bucket receives AutoevolveAI memory backups, or create a dedicated one."
      - "Set a lifecycle policy (for example: keep daily backups 30 days, weekly 1 year). Without one, a nightly job grows the bill indefinitely."
      - "Decide retention for conversation data specifically. Redis will hold user conversation turns (anse/memory/redis_memory.py keys conversation:{id}:turns); backing those to cloud storage is a data-retention decision, not a technical one."
      - "Confirm the service account has objectAdmin on the chosen bucket only, not project-wide storage admin."
      - "Human tier: money, data retention and an IAM grant."
    accept: []

  - id: P3-3
    title: "Redis snapshot to GCS, with a verified restore"
    phase: 3
    tier: mid
    depends_on: [P3-1, P3-2]
    create: [scripts/backup_redis_to_gcs.py, tests/remediation/test_redis_backup_roundtrip.py]
    spec:
      - "Write scripts/backup_redis_to_gcs.py: trigger BGSAVE, wait for rdb_bgsave_in_progress to clear (poll INFO persistence, with a timeout), then upload the RDB via P3-1's GcsBackup under a timestamped name."
      - "Also export the logical keyspace as JSONL alongside the RDB — an RDB is only restorable into a compatible Redis, while the JSONL survives a version change. Cover the documented key families: antigravity:conversation:*, antigravity:trace:*, antigravity:attestation:*, antigravity:stream:audit, and the training watermark keys."
      - "A backup is not complete until it is restorable: implement --verify to download the JSONL just uploaded, parse it, and assert the key count matches what was exported. Fail loudly on mismatch."
      - "Implement --restore FROM_URI that loads a JSONL export into a target Redis, refusing to run against a non-empty database unless --force is given."
      - "Never log key VALUES — they contain conversation content. Log counts and key names only."
      - "Mid tier: a data-integrity round trip with a destructive restore path."
    tests:
      - "Round trip against fakeredis and an injected fake GCS client: populate known keys of each family, back up, flush, restore, assert every key and value is recovered — assert both the count and at least one exact value."
      - "--verify with a truncated download raises and exits non-zero; assert the exception and that it names the expected vs actual count."
      - "--restore against a non-empty DB without --force refuses: assert it raises and that no key was overwritten (read a sentinel key afterwards)."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_redis_backup_roundtrip.py -q -p no:cacheprovider"

  - id: P3-4
    title: "Unify the two Chroma roots that never shared an index"
    phase: 3
    tier: mid
    depends_on: []
    read_first: [anse/memory/harvester.py, anse/memory/chroma_rag.py, anse/config.py]
