  - id: P2-4
    title: "Verify whether Ollama 0.34.1 honours seed and temperature"
    phase: 2
    tier: low
    depends_on: [P0-3]
    create: [v2_runners/verify_ollama_determinism.py, tests/remediation/test_ollama_determinism_runner.py]
    spec:
      - "CLAUDE.md states Ollama 0.1.44 ignores seed/temperature on /v1/chat/completions, which is why anse/core/api_extractor.py has ollama_native=True. This host runs 0.34.1. The caveat may be stale, and several downstream claims ('two runs are two samples') depend on it."
