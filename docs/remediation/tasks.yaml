      - "Also decide on the Millennium modules. The audit found 0 sorry and 0 axiom tokens in the five files, but did NOT build them and did NOT audit what the theorems state. Absence of sorry in an unbuilt file is not evidence of a proof, and these are the highest-stakes claims in the repository."
      - "If anything was shared outside this repo, decide whether a correction is owed to whoever received it."
      - "Human tier: these are your claims and only you can retract or defend them."
