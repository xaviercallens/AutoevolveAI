    title: "Settle the training-data provenance question"
    phase: 4
    tier: human
    depends_on: []
    read_first: [docs/ROADMAP_V1_V2_COMPANION.md]
    spec:
      - "ROADMAP §4.5 flags this as an explicit precondition and it remains undecided: which artifacts may become SFT targets. The roadmap's own position is to train on your own artifacts and verifier outcomes, and to use assistant transcripts for retrieval rather than as SFT targets."
      - "Decide and write it down, because P4-2's gate should encode it. This is a terms-of-use question about the providers whose outputs appear in ~/.claude/projects transcripts."
      - "Also settle the scrubbing requirement from the same section: PII/secret scrubbing as a hard gate with its own test suite, before any capture reaches a training set. The capture path reads real conversation transcripts."
