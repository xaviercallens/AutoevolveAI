      - "Produce docs/remediation/CLAIMS_RECONCILIATION.md listing, for each quantitative claim in the generated paper: the claim, the artifact that should support it, and whether that artifact exists in this checkout. Do not edit the paper in this card."
      - "Also correct the 'SUCCESS' label in the report generator: a run whose loss increased is not a success. Find where that status is written and make the label follow the measurement."
      - "Do NOT fabricate a corrected number. If no run supports a claim, the reconciliation entry says 'unsupported in this checkout' — that is the finding."
      - "Low tier because it is mechanical: read the claims, check the artifacts, tabulate. The judgement about what to do next is P6-3."
    tests: []
    accept:
      - "bash -c 'test -f docs/remediation/CLAIMS_RECONCILIATION.md && grep -qi supported docs/remediation/CLAIMS_RECONCILIATION.md'"
      - ".venv/bin/python -c \"import json,pathlib; p=pathlib.Path('results/redis_lora_execution_report.json'); assert p.exists(), 'report missing'; r=json.loads(p.read_text())['train_report']; assert not (r['loss_reduction_pct'] < 0 and r['status'] == 'SUCCESS'), r\""

