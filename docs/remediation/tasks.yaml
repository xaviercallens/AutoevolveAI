      - "Route both through a single configured path in anse/config.py. Keep data/chroma (it holds the only real embeddings) and point ChromaRAG at it."
      - "Collections stay separate within that one store; it is the persist directory that must be shared."
      - "Also note: anse/config.py:263 sets the harvester JSONL to data/interactions.jsonl, which has NEVER been written — the JSONL side of the harvester has never run. Do not fix that here; card P4-1 depends on it and will."
      - "Mid tier: touches shared config with two live consumers."
    tests:
      - "Both classes, constructed with a tmp_path-patched config, resolve to the same persist directory — assert equality of the resolved paths, and assert the directory is created once."
      - "Writing through the harvester and reading through ChromaRAG returns the written record (use a tmp store, real chromadb — it is installed, so this is not an external-I/O mock)."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_chroma_single_root.py -q -p no:cacheprovider"

  - id: P3-5
    title: "Replace the hash pseudo-embedding with a real one"
    phase: 3
    tier: mid
    depends_on: [P3-4, P2-2]
    read_first: [anse/memory/chroma_rag.py]
    edit: [anse/memory/chroma_rag.py]
    create: [tests/remediation/test_real_embeddings.py]
    spec:
      - "anse/memory/chroma_rag.py:29 FastDeterministicEmbeddingFunction is a hash-based pseudo-embedding. It is deterministic and fast and carries NO semantic signal, so similarity search over it returns arbitrary neighbours. Any 'retrieval' built on it is retrieval in name only."
      - "Replace it with qwen3-embedding:0.6b via Ollama /api/embed — the model is already pulled and is 1024-dimensional. Inject the HTTP client for testability."
      - "Latent dim must be 1024 everywhere. Project memory records the trap: JEPADataset silently zero-pads short vectors to hidden_dim (default 4096), which trains on constant dimensions and looks like it works. Assert the dimension at the boundary rather than padding."
      - "Keep the hash function available under a clearly non-semantic name for offline tests, and document in its docstring that it must never be used for retrieval."
      - "Register the embedding model in P2-2's residency registry — it competes with the generation model for VRAM."
      - "Mid tier: changes what every stored vector means; existing vectors in data/chroma are in the old space and must be re-embedded or dropped (state which in the card report)."
    tests:
      - "Injected client returning a known 1024-vector: assert the embedding is passed through unchanged and that its length is 1024 — two assertions."
      - "A response with the wrong dimension raises rather than being padded; assert the exception names both expected and actual dimensions."
      - "Semantic sanity with a recorded fixture (three vectors, two of them near-duplicates): assert the near-duplicate pair ranks above the unrelated one. Do NOT call the live daemon in a unit test."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_real_embeddings.py -q -p no:cacheprovider"

