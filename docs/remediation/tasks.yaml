  - id: P6-5
    title: "Make the version numbers and docs tell one story"
    phase: 6
    tier: low
    depends_on: []
    read_first: [pyproject.toml, anse/__init__.py, README.md, CLAUDE.md]
    edit: [pyproject.toml, anse/__init__.py]
    create: [tests/remediation/test_version_consistency.py]
    spec:
      - "Three live version numbers disagree: pyproject.toml:3 is 12.2.0, anse/__init__.py:5 is 2.2.0, README.md:8 and :260 say v2.3.0. Pick one and make the others follow it."
      - "Fix pyproject.toml:70: [tool.mypy] python_version = \"10.0.0\" is not a valid version and contradicts requires-python = \">=3.11\" (line 7). Set it to 3.11. P5-4 is blocked on this."
      - "Add a test asserting pyproject's version and anse.__version__ agree, so they cannot drift again."
      - "Update CLAUDE.md's stale environment facts: it says Ollama 0.1.44 ignores seed/temperature, but this host runs 0.34.1 — use P2-4's measured verdict, and do not assert either way without it."
      - "Record in CLAUDE.md that 'v12' is a release label: there is no v12 module or orchestrator, anse/v2..v5 is an orthogonal older numbering, and the real entry points are main.py:91, deploy_anse.py:88, gateway.py and web/. A reader currently cannot learn this from the README, which describes no v10/v11/v12 architecture at all."
    tests:
      - "Assert tomllib-parsed project.version equals anse.__version__ — and assert the value is non-empty, so the test cannot pass on two empty strings."
      - "Assert [tool.mypy] python_version parses as a two-component version and is >= 3.11."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_version_consistency.py -q -p no:cacheprovider"

  - id: P0-9
    title: "Kick-start from the data lake: vendor dead-import modules and real corpora"
    phase: 0
    tier: low
    depends_on: []
    read_first: [scripts/bootstrap_from_datalake.py]
    create: [tests/remediation/test_bootstrap_datalake.py]
    spec:
      - "The GCS data lake holds artifacts this checkout lacks. Two of them repair code the audit wrongly called hallucinated: rl_common.py (19,139 B) and rl_agent_api.py (4,732 B), which satisfy the imports at anse/autopoiesis/dream_lora_trainer.py:27 and anse/v5/laya_system_one.py:47."
      - "Run: .venv/bin/python scripts/bootstrap_from_datalake.py --only code, then --only data. Both stage to the second disk (/mnt/disks/disk-socrateai-local-1/AutoevolveAI/datalake) because / has 81 GB free versus 203 GB there."
      - "Wire the vendored modules onto the import path so the two dead imports resolve. Prefer a path entry or a thin shim over copying the files into anse/ — they are third-party artifacts, not this repo's code, and should stay identifiable as vendored."
      - "Do NOT run --only models in this card, and do NOT restore Redis here. Model promotion is gated by P4-8; the Redis restore writes to /var/lib/redis and belongs to P0-5."
      - "The bootstrap verifies every download against the size the bucket reports and raises on mismatch. Do not add a fallback that swallows a failed fetch — a bootstrap that reports success for a file it did not get is the defect this whole card set exists to remove."
    tests:
      - "Patch subprocess.run so `gcloud storage cp` writes a file of the wrong size; assert fetch() raises RuntimeError and the message names both sizes."
      - "Patch it to report success while writing nothing; assert fetch() raises rather than returning a path (the 'reported success but does not exist' branch)."
      - "Assert the vendored rl_common exposes load_cfg and DecisionModel once the import path is wired — import them and assert both are callable/class objects."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_bootstrap_datalake.py -q -p no:cacheprovider"
      - ".venv/bin/python -c \"import importlib.util as u; assert u.find_spec('rl_common') is not None, 'rl_common still not importable'\""

  - id: P4-8
    title: "Evaluate data-lake model candidates before any of them serve"
    phase: 4
    tier: mid
    depends_on: [P0-9, P4-5]
    create: [tests/remediation/test_lake_candidate_eval.py]
    spec:
      - "The lake's flagship Qwen artifact (merged_quick_restart/model.safetensors, 1.84 GiB) is the output of an 8-step run whose loss ROSE 3.532 -> 3.692, labelled \"status\": \"SUCCESS\" in its own report, on Qwen/Qwen2.5-0.5B-Instruct. Decision of 2026-09-25: 7B is the target base; the 0.5B artifacts are reference and regression fixtures ONLY and must never become the active adapter."
      - "Route every lake model through P4-5's promote() gate: candidate vs incumbent on the frozen eval set plus the personal regression set, strictly-better primary metric, no regression. Auto-promote on pass (decision of 2026-09-25); a SUCCESS label in a manifest is not an input to that decision."
      - "Treat the JEPA checkpoint (jepa_best.pt, 23,435,277 B) as the highest-value candidate: anse/jepa/ is the most genuine trainer in the repo and has never had weights or data. Evaluate it first."
      - "The energy surrogate (surrogate_energy_predictor_v2.pt) stays in shadow mode until AUROC >= 0.80 on a task-split, de-duplicated evaluation, per docs/ROADMAP_V1_V2_COMPANION.md and the Phase-2 leakage finding. Do not promote it on MAE."
      - "Record for each candidate: source URI, byte size, the eval metrics, and the promote/reject decision with its reason. A candidate rejected on measurement is a result worth keeping."
    tests:
      - "A candidate whose primary metric ties the incumbent is rejected; assert promoted is False and the reason names the tie."
      - "A candidate carrying status=SUCCESS metadata but failing the eval is rejected; assert the metadata did not influence the decision (assert on the reason, and that the label appears nowhere in the decision path via inspect.getsource)."
      - "The 0.5B artifacts are never selected as the active adapter even when they pass: assert the promotion path refuses a candidate whose base model id is not the configured target base."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_lake_candidate_eval.py -q -p no:cacheprovider"

  - id: P6-6
    title: "Resolve the 14 uninitialised submodules"
    phase: 6
    tier: low
    depends_on: []
    spec:
      - "All 14 registered submodules are uninitialised (leading '-' in git submodule status; every directory empty): tools/ai-second-brain, tools/autoresearch, and vendor/{aider, antigravity-swarm, dspy, eb_jepa, enso, langgraph, LeanDojo, mcts-reasoning, open-r1, paperproof, SWE-agent, tree-of-thought-llm}."
      - "None are on the critical path: nothing imports from vendor/, and the concepts are reimplemented in-repo (anse/orchestration/dspy_bridge.py:27 'inspired by dspy.Signature', anse/core/red_team.py:38 'Mock/Fallback for LeanDojo'). anse/core/autoresearch_swarm.py:37 has its subprocess call commented out."
      - "For each: either initialise it (if something should import it) or deregister it from .gitmodules. A registered-but-empty submodule is a trap — it makes a fresh clone look broken and invites code that assumes it is populated."
      - "tools/ai-second-brain is the one with a live consumer: anse/core/second_brain.py writes into its empty directory, and update_second_brain.py:15-18 injects 4 hardcoded strings labelled 'Ground Truth'. Deregistering it means that module needs a real home — note that in the card report; do not fix second_brain.py here."
      - "Note the redundancy: langgraph is both a pip dependency (pyproject.toml:25) and a submodule."
    tests: []
    accept:
      - "bash -c 'test -z \"$(git submodule status | grep \"^-\")\" || test -z \"$(git config -f .gitmodules --get-regexp path | awk \"{print \\$2}\" | while read p; do test -d \"$p\" && test -z \"$(ls -A \"$p\")\" && echo \"$p\"; done)\"'"
