      - "Report the actual Ollama version from /api/version in the output. Print a clear verdict per endpoint: HONOURS_SEED or IGNORES_SEED, plus the raw outputs when they differ."
      - "Exit 0 regardless of the verdict — this is a measurement, not a gate. Exit non-zero only when the daemon is unreachable."
      - "Do NOT edit CLAUDE.md in this card. Report the finding; updating the documented caveat is P6-5."
