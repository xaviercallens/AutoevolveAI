# AutoevolveAI remediation workflow — cards for tiered model execution.
#
# Schema matches docs/v2/tasks.yaml (ported to main via card P0-1) so that
# tools/v2_tasks.py can drive it: id, title, phase, tier, depends_on, spec,
# accept (+ optional create, tests, read_first, edit).
#
# Tiers:
#   low   - a Haiku-class model can finish the card from the card alone.
#   mid   - a Sonnet-class model: cross-file reasoning or a judgement call.
#   human - a person runs or decides it: sudo, reboot, money, credentials,
#           published claims, or anything that fails open. accept: [] by
#           convention; where the result is machine-checkable, a paired low
#           card verifies it afterwards.
#
# `accept` commands are run by the DRIVER, never trusted from the model.
# Authored against main (no .coveragerc, no --cov-fail-under=100 gate).
#
# Evidence for every card is in docs/remediation/AUDIT_2026-09-25.md.

rules:
  - "Type-annotate every function signature (.antigravity/rules.md §1.3)."
  - "No stubs (pass / ... / NotImplementedError) and no mock_ dummy_ fake_ prefixes outside tests/ (§6.1). NOTE: .claude/hooks/post_edit_verify.py rejects the edit if a function body is a bare pass/.../raise NotImplementedError. When a card asks you to make a path fail, raise a NAMED domain exception with a message, never NotImplementedError."
  - "Every test needs >=2 real assertions, no tautologies (assert True, assert x == x, lone assert x is not None). Use pytest.raises(Exact, match=...) for negative cases (§2.2)."
  - "Mock only external I/O (sockets, subprocess, cloud clients). Never mock the module under test (§2.3)."
  - "Use Hypothesis for pure functions: assert invariants (round-trip, idempotence, oracle equivalence), not scalar examples (§3)."
  - "Report only real tool output. Never invent a number, a duration, or a test result (§6.3)."
  - "Run tests with .venv/bin/python (3.11). System python3 is 3.10 and breaks on StrEnum."
  - "Do not run `pytest tests/` unscoped until P0-8 lands: tests/test_repl_pain_loop.py shells to real `lake env lean` and triggers a multi-GB Mathlib fetch."
  - "If a card's premise is false when you read the code, stop and report the discrepancy. Do not adapt the card to make it pass."

# Scoped, deterministic acceptance for cards that add a module + its tests.
# Per-card accept lists name the specific test file; this anchor is only for
# cards that must additionally leave the whole remediation suite green.
acc_suite: &acc_suite
  - ".venv/bin/python -m pytest tests/remediation -q -p no:cacheprovider"

cards:

  # ─────────────────────────────────────────────────────────────────────
  # PHASE 0 — Restore the platform. Nothing downstream is real until these
  # land: no GPU, no Redis, no auth, and no card driver on main.
  # ─────────────────────────────────────────────────────────────────────

  - id: P0-1
    title: "Port the card driver to main (cherry-pick 99b8290)"
    phase: 0
    tier: human
    depends_on: []
    spec:
      - "git cherry-pick 99b8290 from origin/AIautoevolveClaudeGCP. It carries tools/v2_tasks.py, tools/setup_v2_env.sh, docs/v2/{tasks.yaml,README.md,MODEL_SELECTION_T4.md}, v2_runners/t4_fit_probe.py, docs/ROADMAP_V1_V2_COMPANION.md."
      - "Expected conflicts are limited to .gitignore, anse/v2/__init__.py, tests/v2/__init__.py. Keep main's versions of the two __init__.py files — main's anse/v2/ has six real modules, the GCP branch has a bare package."
      - "Do NOT run the 42 ported cards. They assume the GCP branch state and a --cov-fail-under=100 gate main does not have; their accept commands will fail on main. They are ported for the driver and for reference only."
      - "Human tier: cherry-pick onto a branch with uncommitted work present, and a judgement call on each conflict."
    accept: []

  - id: P0-2
    title: "Add --file to tools/v2_tasks.py so it can drive this card set"
    phase: 0
    tier: low
    depends_on: [P0-1]
    read_first: [tools/v2_tasks.py]
    edit: [tools/v2_tasks.py]
    create: [tests/remediation/test_v2_tasks_file_flag.py]
    spec:
      - "tools/v2_tasks.py currently hardcodes docs/v2/tasks.yaml and writes state to docs/v2/status.json. Add a global --file PATH option (default: docs/v2/tasks.yaml) accepted by every subcommand (list, next, card, done, check)."
      - "Derive the status path from the tasks path: <dir>/status.json alongside the given file. So --file docs/remediation/tasks.yaml uses docs/remediation/status.json."
      - "Do not change any existing behaviour when --file is omitted. Do not change the render() output format."
      - "While you are here, fix the documented mismatch: `list --tier X` advertises tier filtering but never filters. Make it filter, matching ready()/next semantics."
      - "Do NOT touch the `done` subcommand's behaviour (it appends an id without running accept commands). That is a separate card, P5-7."
    tests:
      - "--file pointing at a temp YAML with 2 cards: list shows both; next returns the one with satisfied deps; done writes status.json NEXT TO the temp file, not under docs/v2/."
      - "Omitting --file still resolves docs/v2/tasks.yaml and docs/v2/status.json (assert on the resolved paths, do not write to the real ones — use monkeypatch)."
      - "list --tier low on a mixed-tier fixture returns only low cards; assert a mid card is absent."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_v2_tasks_file_flag.py -q -p no:cacheprovider"
      - ".venv/bin/python tools/v2_tasks.py --file docs/remediation/tasks.yaml check"

  - id: P0-3
    title: "Restore the NVIDIA driver so the T4 is usable"
    phase: 0
    tier: human
    depends_on: []
    spec:
      - "The T4 is physically present (lspci: 00:04.0 TU104GL [Tesla T4]) but no kernel module is loaded: lsmod shows no nvidia, modinfo nvidia errors, nvidia-smi exits 9, torch.cuda.is_available() is False. Running kernel is 6.8.0-1067-gcp; only nvidia-kernel-common-580-server is installed; dkms is absent."
      - "Install the FLAVOUR metapackage, not the version-pinned one: `sudo apt install linux-modules-nvidia-580-server-gcp nvidia-driver-580-server`. The metapackage (candidate 6.8.0-1067.75~22.04.1+2) tracks kernel upgrades; linux-modules-nvidia-580-server-6.8.0-1067-gcp pins to the current kernel and the GPU will vanish at the next bump."
      - "unattended-upgrades is ACTIVE and /lib/modules holds five kernels (1060, 1063, 1064, 1066, 1067). This is how the GPU was lost. Either keep the metapackage current or hold the kernel — decide and record which."
      - "Reboot, then confirm: nvidia-smi -L names a Tesla T4, and `.venv/bin/python -c 'import torch; print(torch.cuda.is_available(), torch.cuda.get_device_name(0))'` prints True and the device name."
      - "Human tier: passwordless sudo is available on this host, which is exactly why an agent must not do this. Kernel module install plus reboot."
    accept: []

  - id: P0-4
    title: "Machine-checkable GPU readiness probe"
    phase: 0
    tier: low
    depends_on: [P0-3]
    read_first: [anse/infrastructure/agent_environment.py]
    edit: [anse/infrastructure/agent_environment.py]
    create: [tests/remediation/test_gpu_readiness.py]
    spec:
      - "anse/infrastructure/agent_environment.py already has detect_gpu() -> GPUInfo (live nvidia-smi) and AUTOEVOLVE_GPU_HINT. Add: verify_gpu_ready() -> GPUReadiness."
      - "GPUReadiness is a frozen dataclass: driver_ok: bool, torch_cuda_ok: bool, name: str | None, total_memory_mb: int | None, disagreement: str | None."
      - "driver_ok comes from the existing detect_gpu(). torch_cuda_ok comes from torch.cuda.is_available(). Import torch lazily INSIDE the function so the module stays importable on a CPU-only box."
      - "disagreement is a human-readable string when driver_ok != torch_cuda_ok (that combination means a driver/toolkit mismatch, which is the failure mode this card exists to catch), else None."
      - "Add a --require-gpu flag to the module's existing main(): exit 0 when driver_ok and torch_cuda_ok are both True, exit 1 otherwise, printing the readiness dataclass as JSON. This is the gate later cards call."
      - "Do NOT make AUTOEVOLVE_GPU_HINT satisfy --require-gpu. The hint selects a model profile; it must never assert that a driver works."
    tests:
      - "Patch detect_gpu and torch.cuda.is_available across the four combinations; assert disagreement is None when they agree and non-None (mentioning both) when they differ."
      - "--require-gpu exits 1 when torch reports False even if AUTOEVOLVE_GPU_HINT=t4 is set — assert the exit code and that the hint did not flip it."
      - "The module still imports when torch import raises ImportError (simulate with monkeypatch on the import); verify_gpu_ready returns torch_cuda_ok False rather than propagating."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_gpu_readiness.py -q -p no:cacheprovider"

  - id: P0-5
    title: "Install and configure Redis for durable local memory"
    phase: 0
    tier: human
    depends_on: []
    spec:
      - "No Redis exists on this host: no process, nothing on 6379, redis-server and redis-cli absent from PATH. Meanwhile gateway.py:25, attestation_reporter.py:13, harvest_delta.py:17, harvest_training_pipeline.py:18, export_training_data.py:13 and daily_trainer_daemon.py:15 all import redis unconditionally."
      - "Install redis-server. Use the configuration the repo already declares in docker-compose.yml:7-16 rather than inventing one: appendonly yes, appendfsync everysec, maxmemory 4gb, maxmemory-policy noeviction."
      - "Bind to 127.0.0.1 only and set requirepass. Do not expose 6379 on the GCP external interface, and do not add a firewall rule for it."
      - "Put the AOF/RDB directory on /mnt/disks/disk-socrateai-local-1 (203 GB free), not on / (81 GB free)."
      - "Enable the service so it survives reboot — the night job depends on it."
      - "Human tier: package install, a service, and a credential."
    accept: []

  - id: P0-6
    title: "Authenticate gateway.py before Redis holds real data"
    phase: 0
    tier: human
    depends_on: []
    read_first: [gateway.py]
    spec:
      - "SECURITY. gateway.py has no authentication on any route (verified across :661-904). /mcp/tools/{server}/{tool} (:691), /mcp/call (:707) and /mcp/rpc/{server} (:719) invoke arbitrary MCP tools unauthenticated, and :904 is a catch-all proxy."
      - "x_api_key (:736) is only forwarded upstream, never validated. Worse, :751-753 skips upstream entirely when the key is empty or starts with 'test_', returning a synthetic response, and :810-811 fabricates token counts. Remove that bypass — it is a forgery path, not a test affordance."
      - "Add real auth on every route (shared secret compared with hmac.compare_digest at minimum) and deny by default: a new route must be unreachable until explicitly allowed."
      - "Sequence this BEFORE P3-x puts real conversation data in Redis and before GCS credentials are reachable from this process."
      - "Human tier: a security boundary and a credential decision. Do not delegate."
    accept: []

  - id: P0-7
    title: "Confirm the MCP guard server reconnects, or render an absolute path"
    phase: 0
    tier: low
    depends_on: []
    read_first: [.mcp.json, scripts/render_mcp_configs.py]
    spec:
      - "All 17 mcp_guard_server.py tools are currently unreachable from Claude Code. The original .mcp.json pointed at /home/xavkal/... which does not exist on this host; it was changed to ${CLAUDE_PROJECT_DIR:-.}/.venv/bin/python. Whether Claude Code expands that ${VAR:-default} form has NOT been verified by anyone."
      - "Settle it empirically: restart Claude Code, then check whether the python-code-guard server is connected (its tools appear as mcp__python-code-guard__*)."
      - "If it connects: record that in docs/remediation/status notes and stop."
      - "If it does not: extend scripts/render_mcp_configs.py with a render_claude_code_config(project_root) that writes .mcp.json with this machine's literal absolute interpreter path — the same treatment .antigravity/mcp_config.json already gets — and re-run it. Keep check_claude_code_config() working for whichever form ends up in the file."
      - "SCOPE: this card covers the python-code-guard server ONLY. mcp_claude_workflow.py is also absent from .mcp.json, but do NOT declare it here — its verifier (claude_workflow.py:150) executes model-supplied acceptance_command with shell=True, so exposing it before card P5-6 closes that hole would hand a self-certification path to every model that runs these cards. P5-6 declares it."
    tests:
      - "If you add render_claude_code_config: tmp_path fixture, assert the written JSON parses, that the command path is absolute and exists, and that a re-render is idempotent (byte-identical second write)."
    accept:
      - ".venv/bin/python -c \"import json,pathlib; d=json.loads(pathlib.Path('.mcp.json').read_text()); s=d['mcpServers']; assert 'python-code-guard' in s, sorted(s)\""
      - ".venv/bin/python scripts/render_mcp_configs.py --agent claude_code"

  - id: P0-8
    title: "Stop pytest from triggering a multi-GB Mathlib fetch"
    phase: 0
    tier: low
    depends_on: []
    read_first: [tests/test_repl_pain_loop.py, anse/symbolic/repl_pain_loop.py]
    edit: [tests/test_repl_pain_loop.py]
    create: [tests/remediation/test_lean_skip_guard.py]
    spec:
      - "tests/test_repl_pain_loop.py shells out to real `lake env lean` with no skip guard. Any unscoped `pytest tests/` therefore starts a Mathlib download. One fired accidentally during the audit session and left 673 MB in formal/.lake."
      - "Gate every test in that file that invokes lake/lean behind an opt-in env var: skip unless ANSE_LEAN_TESTS=1. Use a module-level pytestmark with pytest.mark.skipif and a reason string that names the variable."
      - "Do not weaken the assertions and do not convert the tests to mocks — when ANSE_LEAN_TESTS=1 they must still run the real compiler. This card changes WHEN they run, never WHAT they check."
      - "Apply the same guard to any other test that shells to lake/lean. Find them with: grep -rln 'lake env lean\\|lake build' tests/"
    tests:
      - "With ANSE_LEAN_TESTS unset, run the file via pytest programmatically and assert every lean-invoking test reports skipped and zero lake subprocesses were spawned (patch subprocess.run and assert it was not called)."
      - "With ANSE_LEAN_TESTS=1, assert the skip mark does not apply (check the mark evaluates False); do not actually run the compiler in this test."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_lean_skip_guard.py -q -p no:cacheprovider"
      - "bash -c 'cd \"$PWD\" && timeout 120 .venv/bin/python -m pytest tests/test_repl_pain_loop.py -q -p no:cacheprovider 2>&1 | grep -qE \"skipped|no tests ran\"'"

  # ─────────────────────────────────────────────────────────────────────
  # PHASE 1 — Stop the fabrication. Quarantine + fail loudly, per the
  # decision on 2026-09-25. Nothing in Phase 4 may be scheduled until this
  # phase is complete: a nightly timer over these paths would industrialise
  # the production of unbacked results.
  # ─────────────────────────────────────────────────────────────────────

  - id: P1-1
    title: "Create the quarantine area and its contract"
    phase: 1
    tier: low
    depends_on: []
    create: [quarantine/README.md, anse/infrastructure/fabrication.py, tests/remediation/test_fabrication_exceptions.py]
    spec:
      - "Create quarantine/README.md explaining: this directory holds modules that reported success without doing the work; nothing here may be imported by anse/, scripts/ or tests/ except by a test asserting it is NOT imported; each entry lists its original path, the audit finding, and the date."
      - "Create anse/infrastructure/fabrication.py defining the exceptions later cards raise instead of returning invented values. Define: FabricatedResultError(RuntimeError) as the base; TelemetryUnavailableError(FabricatedResultError); SimulationRefusedError(FabricatedResultError); UnverifiedDataError(FabricatedResultError)."
      - "Each exception takes a message and stores .component (str) and .remedy (str) attributes, so a caller can print what to do instead. Give the base an __init__(self, message: str, *, component: str, remedy: str) -> None."
      - "These are real exception classes with real bodies — do not use `pass` as a class body (the post-edit hook rejects it). Give each a docstring and let the base hold the logic."
    tests:
      - "Raising TelemetryUnavailableError carries component and remedy through str() and attribute access; assert both attributes and that it is a FabricatedResultError and a RuntimeError."
      - "pytest.raises(FabricatedResultError, match=...) catches each subclass; assert at least two distinct subclasses are caught by the base."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_fabrication_exceptions.py -q -p no:cacheprovider"

  - id: P1-2
    title: "gpu_telemetry: return real NVML readings or raise"
    phase: 1
    tier: low
    depends_on: [P1-1]
    read_first: [anse/infrastructure/gpu_telemetry.py]
    edit: [anse/infrastructure/gpu_telemetry.py]
    create: [tests/remediation/test_gpu_telemetry_real.py]
    spec:
      - "anse/infrastructure/gpu_telemetry.py:16-23 returns random.uniform/random.gauss values while its docstring (:10) claims to replace simulation with 'physical truth' and :14 logs 'Connected to physical GPU sensors'. :13 sets connected = True unconditionally."
      - "Rewrite get_real_telemetry() to read actual values via nvidia-smi --query-gpu=temperature.gpu,utilization.gpu,memory.used,memory.total --format=csv,noheader,nounits, parsed into a typed dict. Reuse the subprocess/timeout/error shape already in anse/infrastructure/agent_environment.py detect_gpu()."
      - "When no GPU is reachable, raise TelemetryUnavailableError (component='gpu_telemetry', remedy pointing at card P0-3). Never return a number that was not measured."
      - "Fix __init__: self.connected must reflect an actual probe, not be hardcoded True."
      - "Remove the 'physical truth' / 'physical sensors' wording; the docstring must describe what the code does."
      - "Delete the random import once unused — vulture and the guards will flag it."
    tests:
      - "Patch subprocess.run to return a known CSV line; assert every parsed field equals the injected value (temperature, utilisation, memory used/total) — at least 3 field assertions."
      - "Patch shutil.which to None; assert pytest.raises(TelemetryUnavailableError, match='gpu') and assert the remedy text mentions the driver card."
      - "Assert the module source contains no 'random.' call: read the file and assert 'random.uniform' not in it and 'random.gauss' not in it."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_gpu_telemetry_real.py -q -p no:cacheprovider"

  - id: P1-3
    title: "engine_v3: remove the hardcoded 'physical energy' multiplier"
    phase: 1
    tier: mid
    depends_on: [P1-2]
    read_first: [anse/v3/engine_v3.py]
    edit: [anse/v3/engine_v3.py]
    create: [tests/remediation/test_engine_v3_energy.py]
    spec:
      - "anse/v3/engine_v3.py:73-80 comments 'Fetch True Physical Telemetry from Hardware' and logs 'based on raw hardware telemetry' while consuming gpu_telemetry's random numbers. Further down it computes final_physical_energy = baseline_energy * 0.95 if commit_success else * 0.99 under a 'Simulate Final Physical execution' comment — a hardcoded multiplier presented as a measurement."
      - "Replace the multiplier with a real measurement from the existing deterministic sandbox (anse/symbolic/sandbox.py), which already computes E = duration_ms + peak_ram_mb. If no measurement is available, raise SimulationRefusedError rather than estimating."
      - "Propagate P1-2's TelemetryUnavailableError instead of swallowing it: on a GPU-less host this path must fail loudly, not produce an energy number."
      - "Correct every comment and log string that claims hardware provenance the code does not have."
      - "Mid tier: requires reading how the sandbox reports energy and rewiring a call site, not a local edit."
    tests:
      - "Patch the sandbox to return a known duration/RAM pair; assert final energy equals the sandbox value and is NOT baseline*0.95 or baseline*0.99 (assert both inequalities explicitly)."
      - "Patch telemetry to raise TelemetryUnavailableError; assert it propagates out of the engine (pytest.raises) rather than being replaced by a default."
      - "Assert the literals 0.95 and 0.99 no longer appear as energy multipliers in the touched function (read the source of that function via inspect.getsource and assert)."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_engine_v3_energy.py -q -p no:cacheprovider"

  - id: P1-4
    title: "latent_dreamer: stop asserting an outcome it never measured"
    phase: 1
    tier: mid
    depends_on: [P1-1]
    read_first: [anse/core/latent_dreamer.py]
    edit: [anse/core/latent_dreamer.py]
    create: [tests/remediation/test_latent_dreamer_honesty.py]
    spec:
      - "anse/core/latent_dreamer.py:121-122 scores torch.randn vectors through a randomly-initialised, never-trained FastJEPALatentPredictor under no_grad — the resulting energies are noise. :262 returns 'catastrophic_forgetting_prevented': True as a literal, having consolidated nothing. :175 computes speedup_vs_sandbox as 3000.0/latency against a hardcoded constant."
      - "Remove the hardcoded True. execute_sleep_cycle must either report a measured retention figure (compare performance on a held-out replay set before and after consolidation) or raise SimulationRefusedError when no trained predictor is loaded."
      - "dream_and_search must refuse to run against an untrained predictor: check for loaded weights and raise SimulationRefusedError naming the checkpoint it expected. Scoring random vectors through random weights is not a search."
      - "Delete speedup_vs_sandbox or make it take the measured sandbox baseline as an argument. A ratio against a hardcoded 3000.0 is not a speedup."
      - "Keep HippocampalReplayEngine (:195-264) — its JSONL append and shuffle are real. Only the claims around it are false."
      - "Mid tier: requires deciding what 'measured retention' means here and touching a class with real callers."
    tests:
      - "Assert execute_sleep_cycle raises SimulationRefusedError when no trained predictor is present; assert the message names a checkpoint path."
      - "With a stub predictor carrying loaded weights, assert the returned retention value is derived from the replay comparison (inject two known scores and assert the arithmetic), not a constant."
      - "Assert the literal True is no longer returned for that key: inspect.getsource of execute_sleep_cycle must not contain 'catastrophic_forgetting_prevented\": True' or \"'catastrophic_forgetting_prevented': True\"."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_latent_dreamer_honesty.py -q -p no:cacheprovider"

  - id: P1-5
    title: "A DRY_RUN must never be recorded as a deployed checkpoint"
    phase: 1
    tier: mid
    depends_on: [P1-1]
    read_first: [daily_trainer_daemon.py, train_checkpoint.py]
    edit: [daily_trainer_daemon.py]
    create: [tests/remediation/test_no_dry_run_deployment.py]
    spec:
      - "THE MOST LOAD-BEARING CARD IN PHASE 1. daily_trainer_daemon.run_cycle:72 accepts train_checkpoint.py's config-only dry-run output (:153-172, taken whenever CUDA is absent per :210-218), hot-reloads it, and calls _record_successful_deployment:29-42, writing antigravity:active_lora_version and pushing antigravity:lora:history. A cycle that trained nothing is recorded as a deployed checkpoint, with no error."
      - "Seven receipts prove it fires: adapters/checkpoint_v*/final_adapter/adapter_config.json, each with \"mode\": \"DRY_RUN\"."
      - "In _record_successful_deployment, read the adapter_config.json being deployed and raise UnverifiedDataError when mode is DRY_RUN or when adapter_model.safetensors is absent from the adapter directory. A deployment record requires trained weights on disk."
      - "In run_cycle, treat a dry-run result as a cycle FAILURE: log at error level and do not advance antigravity:training:watermark_ts. A silent skip would let the watermark march past unprocessed data."
      - "Do not make train_checkpoint.py's dry-run path disappear — it is legitimate for config validation. The defect is the daemon treating it as a success."
      - "Mid tier: a cross-file invariant spanning the daemon, the trainer's return shape and Redis state."
    tests:
      - "Write a temp adapter dir with mode DRY_RUN and no safetensors; assert _record_successful_deployment raises UnverifiedDataError and that fakeredis shows NO write to active_lora_version and no push to lora:history (assert both keys)."
      - "Write a temp adapter dir with mode REAL plus a non-empty adapter_model.safetensors; assert the deployment IS recorded and both keys are set."
      - "Assert run_cycle leaves training:watermark_ts unchanged when the trainer returns a dry-run result (read the key before and after)."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_no_dry_run_deployment.py -q -p no:cacheprovider"

  - id: P1-6
    title: "Quarantine the seven DRY_RUN adapter receipts"
    phase: 1
    tier: low
    depends_on: [P1-5]
    create: [quarantine/dry_run_adapters/README.md]
    spec:
      - "adapters/checkpoint_v*/ contains seven adapter_config.json receipts with \"mode\": \"DRY_RUN\", no weights, and \"dataset\" values using Windows separators (training_runs\\\\datasets\\\\delta_...). Their delta files are 1-line fixtures, so they cannot be output of a real run (default min_samples=50)."
      - "git mv each affected checkpoint directory under quarantine/dry_run_adapters/ preserving its name. Do not delete — they are evidence."
      - "Write quarantine/dry_run_adapters/README.md recording: what these are, that no weights were ever produced, the 2026-09-25 audit reference, and that antigravity:active_lora_version in Redis may still name one (P1-5 prevents new ones; this card does not rewrite history)."
      - "grep for references to adapters/checkpoint_v across the repo and report any code path that still expects them. Do not fix those paths in this card — list them in the README."
    tests: []
    accept:
      - "bash -c 'test -d quarantine/dry_run_adapters && test -f quarantine/dry_run_adapters/README.md'"
      - "bash -c 'test -z \"$(find adapters -name adapter_config.json -exec grep -l DRY_RUN {} + 2>/dev/null)\"'"

  - id: P1-7
    title: "red_team: refuse to audit rather than fabricate a verdict"
    phase: 1
    tier: mid
    depends_on: [P1-1]
    read_first: [anse/core/red_team.py]
    edit: [anse/core/red_team.py]
    create: [tests/remediation/test_red_team_refusal.py]
    spec:
      - "anse/core/red_team.py:32-35 returns a hardcoded simulated PRM verdict when Ollama is unreachable; :82-90 mock_coder_auto_correction fabricates a 'fix'; :37-41 extract_lean_ast is a string-match mock. Verdict logic at :140-147 is substring matching on LLM prose."
      - "Replace the simulated-verdict fallback with SimulationRefusedError naming the unreachable endpoint. An adversarial audit that cannot reach its model must fail, not pass."
      - "Delete mock_coder_auto_correction, or move it to quarantine/ if any caller depends on it — check with grep first and record the result in the card's report."
      - "Rename extract_lean_ast to reflect that it is a regex scan, not an AST, and make it raise rather than return a fake structure when the input does not parse. Naming a string match 'AST' is how a caller comes to trust it."
      - "Leave the substring verdict logic in place but mark it clearly as heuristic in the docstring and return a confidence field the caller can act on. Replacing it properly is out of scope here."
      - "Mid tier: two lazy importers (agent_loop.py:313, lean_agent_loop.py:85) must keep working."
    tests:
      - "Patch the Ollama client to raise ConnectionError; assert pytest.raises(SimulationRefusedError) and that the message contains the endpoint URL."
      - "Assert mock_coder_auto_correction is absent from the module namespace (hasattr is False) — or, if it was moved, that anse.core.red_team does not import from quarantine."
      - "Assert the renamed regex scanner raises on unparseable input instead of returning a dict."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_red_team_refusal.py -q -p no:cacheprovider"
      - ".venv/bin/python -c \"import anse.core.red_team as r; assert not hasattr(r,'mock_coder_auto_correction')\""

  - id: P1-8
    title: "Silent in-memory fallbacks must announce themselves"
    phase: 1
    tier: low
    depends_on: [P1-1]
    read_first: [antigravity-harness/storage/redis_bus.py, anse/memory/redis_memory.py]
    edit: [antigravity-harness/storage/redis_bus.py, anse/memory/redis_memory.py]
    create: [tests/remediation/test_no_silent_memory_loss.py]
    spec:
      - "antigravity-harness/storage/redis_bus.py:126-144 catches bare Exception and swaps in plain dicts, setting is_mock=True with no log or warning, while its docstring (:2) claims 'JSON state persistence'. With Redis down — the current state — every record_trace/publish_event is volatile RAM the caller cannot distinguish from a durable write."
      - "anse/memory/redis_memory.py:48 claims 'Long-term persistent conversation and trace memory'; _connect (:78) only logger.warning()s and store_turn (:92) returns False. Callers that ignore the bool lose data silently."
      - "In redis_bus: narrow the bare `except Exception` to the redis connection errors actually expected, log at ERROR (not debug) naming the host and port, and make is_mock visible in the return value of every write method so a caller cannot mistake volatile for durable."
      - "In redis_memory: keep returning False (callers depend on the signature) but log at ERROR with the key that was dropped, and add a strict: bool = False parameter that raises UnverifiedDataError instead of returning False. The night-training path will pass strict=True."
      - "Correct both docstrings: they may claim persistence only for the path that actually persists."
    tests:
      - "redis_bus with a patched failing connection: assert is_mock is True in a write's return value AND that an ERROR-level record was emitted (caplog), asserting both the level and that the message contains the port."
      - "redis_memory.store_turn(strict=True) with no client: assert pytest.raises(UnverifiedDataError); with strict=False assert it returns False and logs at ERROR."
      - "Assert neither module's docstring claims unconditional persistence: read the source and assert the word 'persistence'/'persistent' is qualified (appears within 200 chars of 'redis' or 'when connected')."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_no_silent_memory_loss.py -q -p no:cacheprovider"

  - id: P1-9
    title: "mcts_lean_solver: fix a proof gate that passes almost anything"
    phase: 1
    tier: mid
    depends_on: [P0-8]
    read_first: [anse/core/mcts_lean_solver.py, anse/formal/lean_runner.py]
    edit: [anse/core/mcts_lean_solver.py]
    create: [tests/remediation/test_mcts_lean_gate.py]
    spec:
      - "anse/core/mcts_lean_solver.py:54-57 invokes bare `lean /tmp/MCTSTarget.lean` and scores success as ('error' not in res.stdout). Lean writes diagnostics to STDERR, so this returns 1.0 ('VICTOIRE') on almost any input, including a file that failed to compile. It also bypasses `lake env`, so `import Mathlib` cannot resolve."
      - "Replace the check with the contract already implemented correctly in anse/formal/lean_runner.py:52-108: run via `lake env lean` with cwd=formal, treat a non-zero exit as failure, and additionally audit `#print axioms <thm>` output for sorryAx. Prefer importing lean_runner over reimplementing it — this repo has five parallel Lean invocation paths already and does not need a sixth."
      - "Score 1.0 only when the exit code is 0 AND no sorryAx appears. Anything else scores 0.0 with the compiler's stderr attached to the result."
      - "Gate the test behind ANSE_LEAN_TESTS=1 per card P0-8 — this card must not reintroduce an unguarded Mathlib fetch."
      - "Mid tier: requires reading two modules and choosing reuse over reimplementation."
    tests:
      - "Patch subprocess to return (returncode=1, stdout='', stderr='error: unknown identifier'); assert the score is 0.0 and the stderr text is carried into the result — assert both."
      - "Patch to (returncode=0, stdout='', stderr=''); assert 1.0. Patch to returncode=0 with sorryAx in the axioms output; assert 0.0."
      - "Regression assertion for the original defect: returncode=1 with an EMPTY stdout must score 0.0 (the old code scored 1.0 here)."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_mcts_lean_gate.py -q -p no:cacheprovider"

  - id: P1-10
    title: "The MCP code critic must fail closed"
    phase: 1
