      - ".venv/bin/python -m py_compile v2_runners/verify_ollama_determinism.py"

  - id: P2-5
    title: "Wire the DeepSeek and Goedel provers to a real verification gate"
    phase: 2
    tier: mid
    depends_on: [P1-9, P2-2]
    create: [anse/formal/prover_client.py, tests/remediation/test_prover_client.py]
    spec:
      - "Both prover models were pulled manually and have ZERO code path: grep finds no reference to hf.co/mradermacher/Goedel-Prover-V2-8B-GGUF:Q6_K or hf.co/unsloth/DeepSeek-Prover-V2-7B-GGUF:Q8_0 anywhere. DeepSeek-Prover exists only as a dormant Cloud Run YAML (config/deepseek_prover_v2_cloudrun.yaml) with no Python client. scripts/lean_interactive_agent.py:51-53 is a literal stub returning 'sorry'."
      - "Create anse/formal/prover_client.py: ProverClient(model: str, base_url: str, client: httpx.Client | None = None) with propose_proof(goal: str, context: str = '') -> ProofAttempt. Inject the HTTP client so tests stay hermetic — follow the pattern in anse/core/api_extractor.py."
      - "ProofAttempt is a frozen dataclass: model, proof_text, verified (bool), verifier_output (str). verified is set ONLY by anse/formal/lean_runner.py's exit-code + sorryAx audit — never by the model's own claim, and never by parsing the model's prose."
      - "Strip any <think> blocks before the proof is parsed (qwen-family and prover models emit them); reuse the existing strip_think helper rather than writing a second one — find it first."
      - "A proof containing `sorry` is verified=False by definition. Assert this explicitly in the code, not just in tests."
      - "Register both models in P2-2's residency registry under role 'prover'. They are 7-8 GB each and cannot be resident alongside the generation model."
      - "Mid tier: a new integration that must defer to an existing verification contract rather than inventing one."
    tests:
      - "Patch the HTTP client to return a proof and the lean runner to report success; assert verified True and that verifier_output is the runner's output, not the model's text."
      - "Patch the runner to report a non-zero exit; assert verified False even though the model claimed success in its prose — this is the card's core invariant."
      - "A returned proof containing 'sorry' is verified False even when the runner exits 0; assert explicitly."
      - "A response wrapped in <think>...</think> has the block stripped before parsing; assert the stripped text and that the marker is absent."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_prover_client.py -q -p no:cacheprovider"

  - id: P2-6
    title: "Decide the DeepSeek Cloud Run service: keep, deploy, or delete"
    phase: 2
    tier: human
