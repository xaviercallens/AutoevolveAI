  # ─────────────────────────────────────────────────────────────────────
  # PHASE 2 — Measure the machine before using it. Nothing here trains;
  # these cards establish the facts Phase 4 depends on.
  # ─────────────────────────────────────────────────────────────────────

  - id: P2-1
    title: "A real VRAM capability check"
    phase: 2
    tier: low
    depends_on: [P0-4]
    create: [anse/infrastructure/vram.py, tests/remediation/test_vram.py]
    spec:
      - "No code in this repo queries real VRAM: zero hits repo-wide for get_device_properties, total_memory, mem_get_info. What exists is hardcoded strings ('RTX 2080 8GB', train_lora_local.py:207, train_grpo.py:178) and unconditional bnb configs."
      - "Create anse/infrastructure/vram.py with: vram_snapshot() -> VramSnapshot (frozen dataclass: total_mb, free_mb, used_mb, device_name), reading torch.cuda.mem_get_info and get_device_properties. Import torch lazily; raise TelemetryUnavailableError when CUDA is unavailable."
      - "Add fits_in_vram(required_mb: int, headroom_mb: int = 1024) -> bool — pure given a snapshot, so take the snapshot as an optional argument for testability: fits_in_vram(required_mb, headroom_mb=1024, snapshot=None)."
      - "Add estimate_qlora_footprint_mb(param_count_b: float, bits: int = 4, batch: int = 1, seq_len: int = 2048) -> int returning a documented, arithmetic estimate (weights + optimizer + activations). Document each term in the docstring. An estimate is honest when it is labelled one."
      - "The T4 has 15,360 MiB — NOT 16 GB. Use the measured figure, never a rounded assumption."
    tests:
      - "Hypothesis: fits_in_vram is monotonic in required_mb (if a larger requirement fits, a smaller one does too) and always False when required_mb + headroom_mb > total_mb — assert both properties."
      - "estimate_qlora_footprint_mb grows with param_count_b and with seq_len; assert two strict inequalities."
      - "vram_snapshot raises TelemetryUnavailableError when torch.cuda.is_available() is patched False; assert the exception type and that .component is set."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_vram.py -q -p no:cacheprovider"

  - id: P2-2
    title: "Model residency policy for a 15 GB T4 holding 27 GB of weights"
    phase: 2
    tier: mid
    depends_on: [P0-3, P2-1]
    create: [anse/infrastructure/model_residency.py, tests/remediation/test_model_residency.py, docs/remediation/MODEL_RESIDENCY.md]
    spec:
      - "'Deploy all the models on the T4' is not physically possible: ~27 GB of pulled weights (qwen3:8b, qwen2.5-coder:7b-instruct, mistral:7b-instruct, qwen3-embedding:0.6b, DeepSeek-Prover-V2-7B Q8, Goedel-Prover-V2-8B Q6) against 15,360 MiB of VRAM. The deliverable is a residency policy, not simultaneous deployment."
      - "Create anse/infrastructure/model_residency.py with a ResidencyPolicy frozen dataclass (model: str, role: str, keep_alive: str, max_loaded: int) and a module-level registry mapping each pulled model to its role: generation, embedding, prover, baseline."
      - "Provide plan_sequence(roles_needed: list[str]) -> list[ResidencyPolicy] returning the load order that minimises evictions — group consecutive uses of the same model, and never schedule two resident models whose combined footprint exceeds the VRAM snapshot."
      - "Set OLLAMA_MAX_LOADED_MODELS=1 and an explicit keep_alive per role. Project memory records the failure mode this prevents: two models evict each other on every trace (~10-20 s reload) and keep_alive holds ~8 GiB."
      - "Document in docs/remediation/MODEL_RESIDENCY.md: the measured sizes, why simultaneous residency is impossible, and the chosen ordering. State plainly that the embedding model and the generation model cannot both stay resident during a trace loop."
      - "Do NOT restart or reconfigure the running Ollama service in this card — it serves other work on this host. Emit the recommended env settings; applying them is card P2-3."
      - "Mid tier: a design with a measured constraint and a real trade-off."
    tests:
      - "plan_sequence never returns a plan whose concurrent footprint exceeds an injected VRAM snapshot — assert with a snapshot smaller than the two largest models combined."
      - "plan_sequence groups repeated roles: given [gen, embed, gen], assert the returned order has the two gen entries adjacent (fewer evictions than the naive order) and assert the length is preserved."
      - "Every registry entry names a model that `ollama list` reports — read the model names from a fixture file, not the live daemon, and assert the registry is a subset."
    accept:
      - ".venv/bin/python -m pytest tests/remediation/test_model_residency.py -q -p no:cacheprovider"

  - id: P2-3
    title: "Apply the Ollama residency settings to the service"
    phase: 2
    tier: human
    depends_on: [P2-2]
    spec:
