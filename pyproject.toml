[project]
name = "autoevolveai"
version = "2.3.0"
description = "ANSE — Autopoietic Neuro-Symbolic Energy-based Model"
authors = [{ name = "xaviercallens" }]
readme = "README.md"
requires-python = ">=3.11"

# Only what anse/ and the root runners import. Lower bounds, no caps: the lockfile pins.
dependencies = [
    "torch>=2.3",
    "transformers>=4.43",
    "accelerate>=0.33",
    "tokenizers>=0.19",
    "chromadb>=0.5",
    "numpy>=1.26",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "tenacity>=8.5",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "rich>=13",
    "langgraph>=1.2.12",
    "loguru>=0.7.3",
    "langchain-core>=1.6.4",
    "langchain-openai>=1.6.5",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
]

[project.optional-dependencies]
# web/server.py
web = ["fastapi>=0.110", "uvicorn>=0.30", "slowapi>=0.1.9"]
# gateway.py, harvest_*.py, daily_trainer_daemon.py, attestation_reporter.py
gateway = ["fastapi>=0.110", "uvicorn>=0.30", "redis>=5.0"]
# mcp_guard_server.py, mcp_claude_workflow.py and the hardening engines in .antigravity/rules.md
guard = ["fastmcp>=2.0", "radon>=6.0", "bandit>=1.7", "vulture>=2.11", "mutmut>=2.4", "pip-audit>=2.7"]
# Tier-2 sandbox (anse/symbolic/sandbox.py)
sandbox = ["docker>=7.1"]
# train_lora_local.py, train_checkpoint.py, train_grpo.py — intended for a GPU machine
training = ["peft>=0.12", "trl>=0.9", "datasets>=2.20", "tensorboard>=2.17", "unsloth"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "fakeredis>=2.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.uv]
# Run from the repo root (pytest sets pythonpath = "."); nothing to build or install.
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = ["E501", "N812", "N999"]

[tool.mypy]
python_version = "2.1.0"
strict = false
ignore_missing_imports = true
exclude = ["results", "vendor", ".venv"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
