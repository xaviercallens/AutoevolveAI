[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "autoevolveai"
version = "0.1.0"
description = "ANSE — Autopoietic Neuro-Symbolic Energy-based Model"
authors = ["xaviercallens"]
readme = "README.md"
packages = [{ include = "anse" }]

[tool.poetry.dependencies]
python = "^3.11"

# Core ML
torch = "^2.3"
torchvision = "^0.18"

# LLM access & hidden-state extraction
transformers = "^4.43"
accelerate = "^0.33"
sentencepiece = "^0.2"
tokenizers = "^0.19"

# Parameter-efficient fine-tuning (LoRA / fast weights)
peft = "^0.12"

# Vector memory (episodic store)
chromadb = "^0.5"

# Sandboxing
docker = "^7.1"      # Python Docker SDK (Tier-2 sandbox)
e2b = "^0.17"        # Cloud sandbox (optional Tier-3)

# Utilities
einops = "^0.8"          # Clean tensor ops
rich = "^13"             # Console dashboard
numpy = "^1.26"
scipy = "^1.13"
pydantic = "^2.7"        # Data validation / config
python-dotenv = "^1.0"
tenacity = "^8.5"        # Retry logic for LLM calls
httpx = "^0.27"          # Async HTTP (Ollama/OpenAI-compat API)
openai = "^1.35"         # OpenAI-compat client for vLLM/Ollama

[tool.poetry.group.dev.dependencies]
pytest = "^8"
pytest-asyncio = "^0.23"
pytest-cov = "^5"
ruff = "^0.5"
mypy = "^1.10"
tensorboard = "^2.17"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
