# GCP T4 Spot Instance for xautoresearch
# Cost: ~$0.11/hr preemptible = $0.009 per 5-min experiment
project: gen-lang-client-0625573011  # user's GCP project (SocrateAI)
zone: us-central1-a
machine_type: n1-standard-4
acceleration:
  - type: nvidia-tesla-t4
    count: 1
preemptible: true
boot_disk:
  size_gb: 50
  image_family: pytorch-latest-gpu
  image_project: deeplearning-platform-release
tags: [xautoresearch, autoresearch]
scopes:
  - storage-rw  # for GCS backup
