# Micro-ML Architect Benchmark Suite
# Phase 2: Building intuition for PyTorch models, dimensions, and parameter efficiency

tasks:
  - name: "noisy_nonlinear_classification"
    category: "architecture"
    task: |
      Write a PyTorch `nn.Module` class to classify a messy synthetic dataset.
      The input features have dimension 20. There are 2 target classes.
      You must achieve >95% accuracy.
      The model must have fewer than 50,000 parameters to save VRAM.
      Name your class something that inherits from nn.Module, and do not include any training loop code.
      Just define the network architecture.
      Use modern techniques like GELU or LayerNorm if needed.
    naive_code: |
      import torch.nn as nn
      import torch.nn.functional as F

      class NaiveClassifier(nn.Module):
          def __init__(self):
              super().__init__()
              # Naive giant linear layer
              self.fc1 = nn.Linear(20, 1000)
              self.fc2 = nn.Linear(1000, 2)
              
          def forward(self, x):
              x = F.relu(self.fc1(x))
              return self.fc2(x)
    reference_optimized_code: |
      import torch.nn as nn

      class OptimizedClassifier(nn.Module):
          def __init__(self):
              super().__init__()
              # Deep but narrow to keep parameters low while retaining expressiveness
              self.net = nn.Sequential(
                  nn.Linear(20, 64),
                  nn.LayerNorm(64),
                  nn.GELU(),
                  nn.Linear(64, 64),
                  nn.LayerNorm(64),
                  nn.GELU(),
                  nn.Linear(64, 2)
              )
              
          def forward(self, x):
              return self.net(x)
    test_harness: |
      # Handled automatically by ml_sandbox.py
