tasks:
  # ─── Tier 1: Easy (Canonical primitives) ──────────────────────────────────
  - name: "Fibonacci"
    tier: "easy"
    task: "Write a function `fibonacci(n)` that returns the n-th Fibonacci number. Include asserts for n=0 -> 0, n=1 -> 1, n=7 -> 13."
    expected_output: null

  - name: "Palindrome Check"
    tier: "easy"
    task: "Write a function `is_palindrome(s: str) -> bool` ignoring non-alphanumeric characters and case. Test with 'A man, a plan, a canal: Panama' and 'race a car'."
    expected_output: null

  - name: "Factorial"
    tier: "easy"
    task: "Write a function `factorial(n: int) -> int` that computes n!. Include asserts for 0! = 1, 5! = 120, and raise ValueError on negative numbers."
    expected_output: null

  - name: "FizzBuzz"
    tier: "easy"
    task: "Write a function `fizzbuzz(n: int) -> list[str]` returning numbers 1 to n with multiples of 3 as 'Fizz', 5 as 'Buzz', and both as 'FizzBuzz'. Assert for n=15."
    expected_output: null

  - name: "Reverse Words"
    tier: "easy"
    task: "Write a function `reverse_words(s: str) -> str` that reverses the words in a sentence. Assert with 'the sky is blue' -> 'blue is sky the'."
    expected_output: null

  # ─── Tier 2: Medium (Data structures & algorithms) ────────────────────────
  - name: "Binary Search"
    tier: "medium"
    task: "Write an iterative binary search `binary_search(arr: list[int], target: int) -> int` returning index or -1. Test with sorted list and present/absent targets."
    expected_output: null

  - name: "Merge Intervals"
    tier: "medium"
    task: "Write a function `merge_intervals(intervals: list[list[int]]) -> list[list[int]]` that merges overlapping intervals. Test with [[1,3],[2,6],[8,10],[15,18]]."
    expected_output: null

  - name: "Valid Parentheses"
    tier: "medium"
    task: "Write `is_valid_brackets(s: str) -> bool` supporting '()', '{}', '[]'. Assert valid for '()[]{}' and '{[]}', and invalid for '(]'."
    expected_output: null

  - name: "Matrix Transpose"
    tier: "medium"
    task: "Write a function `transpose(matrix: list[list[int]]) -> list[list[int]]` without external libraries. Test with 2x3 matrix [[1,2,3],[4,5,6]]."
    expected_output: null

  - name: "Word Frequency Counter"
    tier: "medium"
    task: "Write a function `top_k_words(text: str, k: int) -> list[str]` returning the k most frequent lowercase words. Test with a sample paragraph."
    expected_output: null

  # ─── Tier 3: Hard (Complex logic & stateful objects) ──────────────────────
  - name: "LRU Cache"
    tier: "hard"
    task: "Implement a class `LRUCache(capacity: int)` with `get(key)` and `put(key, value)` operating in O(1) time using collections.OrderedDict or doubly-linked list. Add test cases."
    expected_output: null

  - name: "Topological Sort"
    tier: "hard"
    task: "Implement `topological_sort(num_courses: int, prerequisites: list[list[int]]) -> list[int]` using Kahn's algorithm or DFS. Detect cycles by returning empty list."
    expected_output: null

  - name: "Dijkstra Shortest Path"
    tier: "hard"
    task: "Implement Dijkstra's algorithm `dijkstra(graph: dict[str, dict[str, int]], start: str) -> dict[str, int]` using heapq. Add a test graph with 5 nodes."
    expected_output: null

  - name: "Prefix Tree (Trie)"
    tier: "hard"
    task: "Implement a `Trie` class with `insert(word)`, `search(word) -> bool`, and `starts_with(prefix) -> bool`. Add assertion tests."
    expected_output: null

  - name: "Longest Increasing Subsequence"
    tier: "hard"
    task: "Implement `length_of_lis(nums: list[int]) -> int` in O(n log n) time using binary search (patience sorting). Assert with [10,9,2,5,3,7,101,18] -> 4."
    expected_output: null

  # ─── Tier 4: Adversarial & Edge Cases ─────────────────────────────────────
  - name: "Division By Zero Guard"
    tier: "adversarial"
    task: "Write a safe division function `safe_div(a: float, b: float, default: float = 0.0) -> float` handling zero and non-numeric inputs cleanly with asserts."
    expected_output: null

  - name: "Deeply Nested Flatten"
    tier: "adversarial"
    task: "Write a non-recursive `flatten(nested: list) -> list` that flattens arbitrary nesting without causing recursion errors on deep lists (depth 100). Test."
    expected_output: null

  - name: "Float Precision Sum"
    tier: "adversarial"
    task: "Write a function `is_close_sum(nums: list[float], target: float, tolerance: float = 1e-9) -> bool` testing float accumulation error like 0.1 + 0.2 == 0.3."
    expected_output: null

  - name: "JSON Flatten and Reconstruct"
    tier: "adversarial"
    task: "Write `flatten_json(d: dict, sep='.') -> dict` and `unflatten_json(d: dict, sep='.') -> dict`. Test round-trip equality on a multi-level nested dict."
    expected_output: null

  - name: "Subprocess Blocked Safety Test"
    tier: "adversarial"
    task: "Write a script that computes `sum(range(1000))` and verifies result equals 499500. Ensure it executes cleanly in the Tier 1 sandbox without dangerous imports."
    expected_output: null
