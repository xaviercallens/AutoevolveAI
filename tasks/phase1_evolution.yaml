      - "assert nth_fibonacci(1) == 1"
      - "assert nth_fibonacci(10) == 55"
      - "assert nth_fibonacci(300) == 222232244629420445529739893461909967206666939096499764990979600"
      - |
        try:
            nth_fibonacci(-3)
            raise AssertionError("expected ValueError for negative n")
        except ValueError:
            pass
      - |
        try:
            nth_fibonacci(1.0)
            raise AssertionError("expected TypeError for float")
        except TypeError:
            pass

  - name: second_largest
    family: numeric
    split: test
    task: "Write a function `second_largest(values: list[int]) -> int` that returns the second largest distinct value without modifying the input list. Duplicates count once, so second_largest([5, 5, 3]) is 3. Raise ValueError if there are fewer than two distinct values (including an empty list)."
    reference: |
      def second_largest(values):
          distinct = sorted(set(values))
          if len(distinct) < 2:
