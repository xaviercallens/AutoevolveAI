tasks:
  - name: rotate_list
    family: sequences
    split: train
    task: 'Write a function `rotate_list(lst: list, k: int) -> list` that returns
      a new list rotated to the right by k positions. k may be larger than the list
      length or zero, and the list may be empty.'
    reference: "def rotate_list(lst, k):\n    if not lst:\n        return []\n   \
      \ k %= len(lst)\n    return lst[-k:] + lst[:-k] if k else list(lst)\n"
    tests:
      - call: rotate_list
        args:
          - [1, 2, 3, 4, 5]
          - 2
        expect: [4, 5, 1, 2, 3]
      - call: rotate_list
        args:
          - [1, 2, 3]
          - 0
        expect: [1, 2, 3]
      - call: rotate_list
        args:
          - [1, 2, 3]
          - 3
        expect: [1, 2, 3]
      - call: rotate_list
        args:
          - [1, 2, 3]
          - 7
        expect: [3, 1, 2]
      - call: rotate_list
        args:
          - []
          - 4
        expect: []
  - name: chunk_list
    family: sequences
    split: train
    task: 'Write a function `chunk_list(lst: list, size: int) -> list[list]` that
      splits lst into consecutive chunks of length size (the last chunk may be shorter).
      Raise ValueError if size <= 0. An empty list gives an empty list.'
    reference: "def chunk_list(lst, size):\n    if size <= 0:\n        raise ValueError(\"\
      size must be positive\")\n    return [lst[i:i + size] for i in range(0, len(lst),\
      \ size)]\n"
    tests:
      - call: chunk_list
        args:
          - [1, 2, 3, 4, 5]
          - 2
        expect:
          - [1, 2]
          - [3, 4]
          - [5]
      - call: chunk_list
        args:
          - [1, 2, 3]
          - 3
        expect:
          - [1, 2, 3]
      - call: chunk_list
        args:
          - [1, 2]
          - 5
        expect:
          - [1, 2]
      - call: chunk_list
        args:
          - []
          - 3
        expect: []
      - call: chunk_list
        args:
          - [1]
          - 0
        raises: ValueError
  - name: rotate_string
    family: sequences
    split: test
    task: 'Write a function `rotate_string(s: str, k: int) -> str` that returns s
      rotated to the left by k positions. k may be larger than the string length or
      zero, and the string may be empty.'
    reference: "def rotate_string(s, k):\n    if not s:\n        return \"\"\n   \
      \ k %= len(s)\n    return s[k:] + s[:k]\n"
    tests:
      - call: rotate_string
        args: [abcdef, 2]
        expect: cdefab
      - call: rotate_string
        args: [abc, 0]
        expect: abc
      - call: rotate_string
        args: [abc, 3]
        expect: abc
      - call: rotate_string
        args: [abc, 4]
        expect: bca
      - call: rotate_string
        args: ['', 5]
        expect: ''
  - name: sliding_windows
    family: sequences
    split: test
    task: 'Write a function `sliding_windows(lst: list, size: int) -> list[list]`
      that returns every contiguous window of length size, in order. Raise ValueError
      if size <= 0. If size is larger than the list, return an empty list.'
    reference: "def sliding_windows(lst, size):\n    if size <= 0:\n        raise\
      \ ValueError(\"size must be positive\")\n    return [lst[i:i + size] for i in\
      \ range(len(lst) - size + 1)]\n"
    tests:
      - call: sliding_windows
        args:
          - [1, 2, 3, 4]
          - 2
        expect:
          - [1, 2]
          - [2, 3]
          - [3, 4]
      - call: sliding_windows
        args:
          - [1, 2, 3]
          - 3
        expect:
          - [1, 2, 3]
      - call: sliding_windows
        args:
          - [1, 2]
          - 3
        expect: []
      - call: sliding_windows
        args:
          - []
          - 1
        expect: []
      - call: sliding_windows
        args:
          - [1, 2]
          - 0
        raises: ValueError
  - name: validate_ipv4
    family: parsing
    split: train
    task: 'Write a function `validate_ipv4(s: str) -> bool` that returns True only
      if s is a valid dotted IPv4 address: exactly four decimal parts separated by
      ''.'', each between 0 and 255, digits only, and no leading zeros (so ''01''
      is invalid but ''0'' is valid).'
    reference: "def validate_ipv4(s):\n    parts = s.split(\".\")\n    if len(parts)\
      \ != 4:\n        return False\n    for p in parts:\n        if not p.isascii()\
      \ or not p.isdigit():\n            return False\n        if len(p) > 1 and p[0]\
      \ == \"0\":\n            return False\n        if int(p) > 255:\n          \
      \  return False\n    return True\n"
    tests:
      - call: validate_ipv4
        args: [192.168.1.1]
        expect: true
      - call: validate_ipv4
        args: [0.0.0.0]
        expect: true
      - call: validate_ipv4
        args: [256.1.1.1]
        expect: false
      - call: validate_ipv4
        args: [1.2.3]
        expect: false
      - call: validate_ipv4
        args: [01.2.3.4]
        expect: false
      - call: validate_ipv4
        args: [1.2.3.a]
        expect: false
      - call: validate_ipv4
        args: [1.2.3.-4]
        expect: false
  - name: parse_duration
    family: parsing
    split: train
    task: 'Write a function `parse_duration(s: str) -> int` that converts a duration
      like ''1h30m15s'' into total seconds. Units are h, m and s; each is optional
      but they must appear in that order, e.g. ''45m'', ''2h'', ''10s'', ''1h5s''.
      Raise ValueError for an empty string or any malformed input such as ''5x'',
      ''abc'' or ''1m1h''.'
    reference: "import re\n\ndef parse_duration(s):\n    m = re.fullmatch(r\"(?:(\\\
      d+)h)?(?:(\\d+)m)?(?:(\\d+)s)?\", s)\n    if not s or m is None:\n        raise\
      \ ValueError(\"malformed duration\")\n    h, mi, se = (int(g) if g else 0 for\
      \ g in m.groups())\n    return h * 3600 + mi * 60 + se\n"
    tests:
      - call: parse_duration
        args: [1h30m15s]
        expect: 5415
      - call: parse_duration
        args: [45m]
        expect: 2700
      - call: parse_duration
        args: [2h]
        expect: 7200
      - call: parse_duration
        args: [1h5s]
        expect: 3605
      - call: parse_duration
        args: ['']
        raises: ValueError
      - call: parse_duration
        args: [5x]
        raises: ValueError
      - call: parse_duration
        args: [1m1h]
        raises: ValueError
  - name: validate_hex_color
    family: parsing
    split: test
    task: 'Write a function `validate_hex_color(s: str) -> bool` that returns True
      only if s is a valid CSS hex color: a ''#'' followed by exactly 3 or exactly
      6 hexadecimal digits (upper or lower case). Anything else, including a missing
      ''#'', other lengths or surrounding spaces, is invalid.'
    reference: "import re\n\ndef validate_hex_color(s):\n    return re.fullmatch(r\"\
      #(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})\", s) is not None\n"
    tests:
      - call: validate_hex_color
        args: ['#fff']
        expect: true
      - call: validate_hex_color
        args: ['#A1b2C3']
        expect: true
      - call: validate_hex_color
        args: [fff]
        expect: false
      - call: validate_hex_color
        args: ['#ffff']
        expect: false
      - call: validate_hex_color
        args: ['#ggg']
        expect: false
      - call: validate_hex_color
        args: ['#fff ']
        expect: false
      - call: validate_hex_color
        args: ['']
        expect: false
  - name: parse_size
    family: parsing
    split: test
    task: 'Write a function `parse_size(s: str) -> int` that converts a size like
      ''10KB'' into bytes as an int. Units are B, KB, MB and GB using powers of 1024,
      the unit is case-insensitive and required, and the number may be a decimal such
      as ''1.5KB'' (round down to an int). Raise ValueError for an empty string or
      any malformed input such as ''10'', ''KB'' or ''5TBX''.'
    reference: "import re\n\ndef parse_size(s):\n    m = re.fullmatch(r\"(\\d+(?:\\\
      .\\d+)?)(B|KB|MB|GB)\", s.upper())\n    if m is None:\n        raise ValueError(\"\
      malformed size\")\n    factor = {\"B\": 1, \"KB\": 1024, \"MB\": 1024 ** 2,\
      \ \"GB\": 1024 ** 3}[m.group(2)]\n    return int(float(m.group(1)) * factor)\n"
    tests:
      - call: parse_size
        args: [10KB]
        expect: 10240
      - call: parse_size
        args: [1.5KB]
        expect: 1536
      - call: parse_size
        args: [3mb]
        expect: 3145728
      - call: parse_size
        args: [7B]
        expect: 7
      - call: parse_size
        args: [2GB]
        expect: 2147483648
      - call: parse_size
        args: ['10']
        raises: ValueError
      - call: parse_size
        args: ['']
        raises: ValueError
  - name: factorial
    family: numeric
    split: train
    task: 'Write a function `factorial(n: int) -> int` that computes n!. factorial(0)
      is 1. Raise ValueError if n is negative and TypeError if n is not an int (a
      bool or float is not accepted).'
    reference: "def factorial(n):\n    if isinstance(n, bool) or not isinstance(n,\
      \ int):\n        raise TypeError(\"n must be an int\")\n    if n < 0:\n    \
      \    raise ValueError(\"n must be non-negative\")\n    result = 1\n    for i\
      \ in range(2, n + 1):\n        result *= i\n    return result\n"
    tests:
      - call: factorial
        args: [0]
        expect: 1
      - call: factorial
        args: [5]
        expect: 120
      - call: factorial
        args: [20]
        expect: 2432902008176640000
      - call: factorial
        args: [-1]
        raises: ValueError
      - call: factorial
        args: [2.5]
        raises: TypeError
  - name: median
    family: numeric
    split: train
    task: 'Write a function `median(values: list[float]) -> float` that returns the
      median without modifying the input list. For an even count return the mean of
      the two middle values. Raise ValueError if the list is empty.'
    reference: "def median(values):\n    if not values:\n        raise ValueError(\"\
      empty list\")\n    s = sorted(values)\n    mid = len(s) // 2\n    return float(s[mid])\
      \ if len(s) % 2 else (s[mid - 1] + s[mid]) / 2\n"
    tests:
      - call: median
        args:
          - [3, 1, 2]
        expect: 2.0
      - call: median
        args:
          - [4, 1, 3, 2]
        expect: 2.5
      - call: median
        args:
          - [7]
        expect: 7.0
      - call: median
        args:
          - [3, 1, 2]
        args_unchanged: true
      - call: median
        args:
          - []
        raises: ValueError
  - name: nth_fibonacci
    family: numeric
    split: test
    task: 'Write a function `nth_fibonacci(n: int) -> int` with nth_fibonacci(0) ==
      0 and nth_fibonacci(1) == 1. It must be fast enough for n = 300. Raise ValueError
      if n is negative and TypeError if n is not an int (a bool or float is not accepted).'
    reference: "def nth_fibonacci(n):\n    if isinstance(n, bool) or not isinstance(n,\
      \ int):\n        raise TypeError(\"n must be an int\")\n    if n < 0:\n    \
      \    raise ValueError(\"n must be non-negative\")\n    a, b = 0, 1\n    for\
      \ _ in range(n):\n        a, b = b, a + b\n    return a\n"
    tests:
      - call: nth_fibonacci
        args: [0]
        expect: 0
      - call: nth_fibonacci
        args: [1]
        expect: 1
      - call: nth_fibonacci
        args: [10]
        expect: 55
      - call: nth_fibonacci
        args: [300]
        expect: 222232244629420445529739893461909967206666939096499764990979600
      - call: nth_fibonacci
        args: [-3]
        raises: ValueError
      - call: nth_fibonacci
        args: [1.0]
        raises: TypeError
  - name: second_largest
    family: numeric
    split: test
    task: 'Write a function `second_largest(values: list[int]) -> int` that returns
      the second largest distinct value without modifying the input list. Duplicates
      count once, so second_largest([5, 5, 3]) is 3. Raise ValueError if there are
      fewer than two distinct values (including an empty list).'
    reference: "def second_largest(values):\n    distinct = sorted(set(values))\n\
      \    if len(distinct) < 2:\n        raise ValueError(\"need two distinct values\"\
      )\n    return distinct[-2]\n"
    tests:
      - call: second_largest
        args:
          - [1, 2, 3]
        expect: 2
      - call: second_largest
        args:
          - [5, 5, 3]
        expect: 3
      - call: second_largest
        args:
          - [-1, -5, -3]
        expect: -3
      - call: second_largest
        args:
          - [2, 9, 4]
        args_unchanged: true
      - call: second_largest
        args:
          - [7, 7]
        raises: ValueError
      - call: second_largest
        args:
          - []
        raises: ValueError
  - name: camel_to_snake
    family: text
    split: train
    task: 'Write a function `camel_to_snake(name: str) -> str` that converts camelCase
      or PascalCase to snake_case. A run of capitals is one acronym word: ''HTTPServer''
      -> ''http_server'', ''parseURL'' -> ''parse_url'', ''userID2Name'' -> ''user_id2_name''.
      An empty string stays empty and an already snake_case name is unchanged.'
    reference: "import re\n\ndef camel_to_snake(name):\n    s = re.sub(r\"([A-Z]+)([A-Z][a-z])\"\
      , r\"\\1_\\2\", name)\n    s = re.sub(r\"([a-z0-9])([A-Z])\", r\"\\1_\\2\",\
      \ s)\n    return s.lower()\n"
    tests:
      - call: camel_to_snake
        args: [camelCase]
        expect: camel_case
      - call: camel_to_snake
        args: [PascalCase]
        expect: pascal_case
      - call: camel_to_snake
        args: [HTTPServer]
        expect: http_server
      - call: camel_to_snake
        args: [parseURL]
        expect: parse_url
      - call: camel_to_snake
        args: [userID2Name]
        expect: user_id2_name
      - call: camel_to_snake
        args: ['']
        expect: ''
      - call: camel_to_snake
        args: [already_snake]
        expect: already_snake
  - name: run_length_encode
    family: text
    split: train
    task: 'Write a function `run_length_encode(s: str) -> str` that replaces each
      run of a repeated character with the count followed by the character, always
      writing the count even when it is 1: ''aaabcc'' -> ''3a1b2c''. An empty string
      gives an empty string. The input never contains digits.'
    reference: "from itertools import groupby\n\ndef run_length_encode(s):\n    return\
      \ \"\".join(f\"{len(list(g))}{ch}\" for ch, g in groupby(s))\n"
    tests:
      - call: run_length_encode
        args: [aaabcc]
        expect: 3a1b2c
      - call: run_length_encode
        args: [a]
        expect: 1a
      - call: run_length_encode
        args: ['']
        expect: ''
      - call: run_length_encode
        args: [abab]
        expect: 1a1b1a1b
      - call: run_length_encode
        args: [zzzzzzzzzzzz]
        expect: 12z
  - name: snake_to_camel
    family: text
    split: test
    task: 'Write a function `snake_to_camel(name: str) -> str` that converts snake_case
      to camelCase: ''user_id'' -> ''userId''. The first word stays lower case, repeated
      or trailing underscores are ignored (''a__b_'' -> ''aB''), leading underscores
      are kept (''_private_var'' -> ''_privateVar''), and an empty string stays empty.'
    reference: "def snake_to_camel(name):\n    stripped = name.lstrip(\"_\")\n   \
      \ prefix = name[: len(name) - len(stripped)]\n    words = [w for w in stripped.split(\"\
      _\") if w]\n    if not words:\n        return prefix\n    return prefix + words[0].lower()\
      \ + \"\".join(w[0].upper() + w[1:].lower() for w in words[1:])\n"
    tests:
      - call: snake_to_camel
        args: [user_id]
        expect: userId
      - call: snake_to_camel
        args: [simple]
        expect: simple
      - call: snake_to_camel
        args: [http_server_port]
        expect: httpServerPort
      - call: snake_to_camel
        args: [a__b_]
        expect: aB
      - call: snake_to_camel
        args: [_private_var]
        expect: _privateVar
      - call: snake_to_camel
        args: ['']
        expect: ''
  - name: run_length_decode
    family: text
    split: test
    task: 'Write a function `run_length_decode(s: str) -> str` that reverses run-length
      encoding where each run is a count followed by a character: ''3a1b2c'' -> ''aaabcc''.
      Counts may have several digits (''12z''). An empty string gives an empty string.
      Raise ValueError for malformed input such as ''a3'', ''3'' or ''ab''.'
    reference: "import re\n\ndef run_length_decode(s):\n    if re.fullmatch(r\"(?:\\\
      d+\\D)*\", s) is None:\n        raise ValueError(\"malformed run-length string\"\
      )\n    return \"\".join(ch * int(n) for n, ch in re.findall(r\"(\\d+)(\\D)\"\
      , s))\n"
    tests:
      - call: run_length_decode
        args: [3a1b2c]
        expect: aaabcc
      - call: run_length_decode
        args: [12z]
        expect: zzzzzzzzzzzz
      - call: run_length_decode
        args: ['']
        expect: ''
      - call: run_length_decode
        args: [1a1b1a1b]
        expect: abab
      - call: run_length_decode
        args: [a3]
        raises: ValueError
      - call: run_length_decode
        args: ['3']
        raises: ValueError
  - name: merge_intervals
    family: ranges
    split: train
    task: 'Write a function `merge_intervals(intervals: list[list[int]]) -> list[list[int]]`
      that merges overlapping closed intervals and returns them sorted by start. The
      input may be unsorted, intervals that merely touch are merged ([1,2] and [2,3]
      -> [1,3]), and the input list must not be modified. An empty list gives an empty
      list.'
    reference: "def merge_intervals(intervals):\n    merged = []\n    for start, end\
      \ in sorted(intervals):\n        if merged and start <= merged[-1][1]:\n   \
      \         merged[-1][1] = max(merged[-1][1], end)\n        else:\n         \
      \   merged.append([start, end])\n    return merged\n"
    tests:
      - call: merge_intervals
        args:
          - - [1, 3]
            - [2, 6]
            - [8, 10]
            - [15, 18]
        expect:
          - [1, 6]
          - [8, 10]
          - [15, 18]
      - call: merge_intervals
        args:
          - - [8, 10]
            - [1, 3]
            - [2, 6]
        expect:
          - [1, 6]
          - [8, 10]
      - call: merge_intervals
        args:
          - - [1, 2]
            - [2, 3]
        expect:
          - [1, 3]
      - call: merge_intervals
        args:
          - - [1, 10]
            - [2, 3]
        expect:
          - [1, 10]
      - call: merge_intervals
        args:
          - []
        expect: []
      - call: merge_intervals
        args:
          - - [5, 6]
            - [1, 2]
        args_unchanged: true
  - name: compress_ranges
    family: ranges
    split: train
    task: 'Write a function `compress_ranges(nums: list[int]) -> str` that turns a
      list of integers into a compact range string: [1,2,3,5,7,8] -> ''1-3,5,7-8''.
      The input may be unsorted and contain duplicates. A run of two consecutive numbers
      is also written as a range (''7-8''). An empty list gives an empty string.'
    reference: "def compress_ranges(nums):\n    values = sorted(set(nums))\n    parts\
      \ = []\n    i = 0\n    while i < len(values):\n        j = i\n        while\
      \ j + 1 < len(values) and values[j + 1] == values[j] + 1:\n            j +=\
      \ 1\n        parts.append(str(values[i]) if i == j else f\"{values[i]}-{values[j]}\"\
      )\n        i = j + 1\n    return \",\".join(parts)\n"
    tests:
      - call: compress_ranges
        args:
          - [1, 2, 3, 5, 7, 8]
        expect: 1-3,5,7-8
      - call: compress_ranges
        args:
          - [5]
        expect: '5'
      - call: compress_ranges
        args:
          - []
        expect: ''
      - call: compress_ranges
        args:
          - [3, 1, 2, 2, 10]
        expect: 1-3,10
      - call: compress_ranges
        args:
          - [1, 3, 5]
        expect: 1,3,5
  - name: expand_ranges
    family: ranges
    split: test
    task: 'Write a function `expand_ranges(s: str) -> list[int]` that expands a compact
      range string into a sorted list of distinct integers: ''1-3,5,7-8'' -> [1,2,3,5,7,8].
      Parts may be in any order and may overlap. An empty string gives an empty list.
      Raise ValueError for malformed parts such as ''a'', ''3-'' or a descending range
      like ''5-2''.'
    reference: "import re\n\ndef expand_ranges(s):\n    if not s:\n        return\
      \ []\n    out = set()\n    for part in s.split(\",\"):\n        m = re.fullmatch(r\"\
      (\\d+)(?:-(\\d+))?\", part.strip())\n        if m is None:\n            raise\
      \ ValueError(f\"malformed part: {part!r}\")\n        lo = int(m.group(1))\n\
      \        hi = int(m.group(2)) if m.group(2) else lo\n        if hi < lo:\n \
      \           raise ValueError(f\"descending range: {part!r}\")\n        out.update(range(lo,\
      \ hi + 1))\n    return sorted(out)\n"
    tests:
      - call: expand_ranges
        args: ['1-3,5,7-8']
        expect: [1, 2, 3, 5, 7, 8]
      - call: expand_ranges
        args: ['5']
        expect: [5]
      - call: expand_ranges
        args: ['']
        expect: []
      - call: expand_ranges
        args: ['7-8,1-3,2-4']
        expect: [1, 2, 3, 4, 7, 8]
      - call: expand_ranges
        args: [5-2]
        raises: ValueError
      - call: expand_ranges
        args: ['1,a']
        raises: ValueError
  - name: missing_ranges
    family: ranges
    split: test
    task: 'Write a function `missing_ranges(nums: list[int], lo: int, hi: int) ->
      list[list[int]]` that returns the closed intervals of integers in [lo, hi] that
      do not appear in nums, sorted by start. nums may be unsorted, contain duplicates
      and contain values outside [lo, hi]. missing_ranges([0, 1, 3, 50, 75], 0, 99)
      is [[2, 2], [4, 49], [51, 74], [76, 99]]. If nothing is missing return an empty
      list.'
    reference: "def missing_ranges(nums, lo, hi):\n    result = []\n    nxt = lo\n\
      \    for n in sorted(set(nums)):\n        if n < lo or n > hi:\n           \
      \ continue\n        if n > nxt:\n            result.append([nxt, n - 1])\n \
      \       nxt = n + 1\n    if nxt <= hi:\n        result.append([nxt, hi])\n \
      \   return result\n"
    tests:
      - call: missing_ranges
        args:
