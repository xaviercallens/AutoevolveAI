  # ── Family: text transformation ─────────────────────────────────────────
  - name: camel_to_snake
    family: text
    split: train
    task: "Write a function `camel_to_snake(name: str) -> str` that converts camelCase or PascalCase to snake_case. A run of capitals is one acronym word: 'HTTPServer' -> 'http_server', 'parseURL' -> 'parse_url', 'userID2Name' -> 'user_id2_name'. An empty string stays empty and an already snake_case name is unchanged."
    reference: |
      import re

      def camel_to_snake(name):
          s = re.sub(r"([A-Z]+)([A-Z][a-z])", r"\1_\2", name)
          s = re.sub(r"([a-z0-9])([A-Z])", r"\1_\2", s)
          return s.lower()
    tests:
      - "assert camel_to_snake('camelCase') == 'camel_case'"
      - "assert camel_to_snake('PascalCase') == 'pascal_case'"
      - "assert camel_to_snake('HTTPServer') == 'http_server'"
      - "assert camel_to_snake('parseURL') == 'parse_url'"
      - "assert camel_to_snake('userID2Name') == 'user_id2_name'"
      - "assert camel_to_snake('') == ''"
      - "assert camel_to_snake('already_snake') == 'already_snake'"

  - name: run_length_encode
    family: text
    split: train
    task: "Write a function `run_length_encode(s: str) -> str` that replaces each run of a repeated character with the count followed by the character, always writing the count even when it is 1: 'aaabcc' -> '3a1b2c'. An empty string gives an empty string. The input never contains digits."
    reference: |
      from itertools import groupby

      def run_length_encode(s):
          return "".join(f"{len(list(g))}{ch}" for ch, g in groupby(s))
    tests:
      - "assert run_length_encode('aaabcc') == '3a1b2c'"
      - "assert run_length_encode('a') == '1a'"
      - "assert run_length_encode('') == ''"
      - "assert run_length_encode('abab') == '1a1b1a1b'"
      - "assert run_length_encode('zzzzzzzzzzzz') == '12z'"

  - name: snake_to_camel
    family: text
    split: test
    task: "Write a function `snake_to_camel(name: str) -> str` that converts snake_case to camelCase: 'user_id' -> 'userId'. The first word stays lower case, repeated or trailing underscores are ignored ('a__b_' -> 'aB'), leading underscores are kept ('_private_var' -> '_privateVar'), and an empty string stays empty."
    reference: |
      def snake_to_camel(name):
          stripped = name.lstrip("_")
          prefix = name[: len(name) - len(stripped)]
          words = [w for w in stripped.split("_") if w]
          if not words:
              return prefix
          return prefix + words[0].lower() + "".join(w[0].upper() + w[1:].lower() for w in words[1:])
    tests:
      - "assert snake_to_camel('user_id') == 'userId'"
      - "assert snake_to_camel('simple') == 'simple'"
      - "assert snake_to_camel('http_server_port') == 'httpServerPort'"
      - "assert snake_to_camel('a__b_') == 'aB'"
      - "assert snake_to_camel('_private_var') == '_privateVar'"
      - "assert snake_to_camel('') == ''"

  - name: run_length_decode
    family: text
    split: test
    task: "Write a function `run_length_decode(s: str) -> str` that reverses run-length encoding where each run is a count followed by a character: '3a1b2c' -> 'aaabcc'. Counts may have several digits ('12z'). An empty string gives an empty string. Raise ValueError for malformed input such as 'a3', '3' or 'ab'."
    reference: |
      import re

      def run_length_decode(s):
          if re.fullmatch(r"(?:\d+\D)*", s) is None:
              raise ValueError("malformed run-length string")
          return "".join(ch * int(n) for n, ch in re.findall(r"(\d+)(\D)", s))
    tests:
      - "assert run_length_decode('3a1b2c') == 'aaabcc'"
      - "assert run_length_decode('12z') == 'z' * 12"
      - "assert run_length_decode('') == ''"
      - "assert run_length_decode('1a1b1a1b') == 'abab'"
      - |
        try:
            run_length_decode('a3')
            raise AssertionError("expected ValueError for 'a3'")
        except ValueError:
            pass
      - |
        try:
            run_length_decode('3')
            raise AssertionError("expected ValueError for '3'")
        except ValueError:
            pass

  # ── Family: integer ranges and intervals ────────────────────────────────
  - name: merge_intervals
    family: ranges
    split: train
    task: "Write a function `merge_intervals(intervals: list[list[int]]) -> list[list[int]]` that merges overlapping closed intervals and returns them sorted by start. The input may be unsorted, intervals that merely touch are merged ([1,2] and [2,3] -> [1,3]), and the input list must not be modified. An empty list gives an empty list."
    reference: |
      def merge_intervals(intervals):
          merged = []
          for start, end in sorted(intervals):
              if merged and start <= merged[-1][1]:
                  merged[-1][1] = max(merged[-1][1], end)
              else:
                  merged.append([start, end])
          return merged
    tests:
      - "assert merge_intervals([[1, 3], [2, 6], [8, 10], [15, 18]]) == [[1, 6], [8, 10], [15, 18]]"
      - "assert merge_intervals([[8, 10], [1, 3], [2, 6]]) == [[1, 6], [8, 10]]"
      - "assert merge_intervals([[1, 2], [2, 3]]) == [[1, 3]]"
      - "assert merge_intervals([[1, 10], [2, 3]]) == [[1, 10]]"
      - "assert merge_intervals([]) == []"
      - |
        data = [[5, 6], [1, 2]]
        merge_intervals(data)
        assert data == [[5, 6], [1, 2]], "input list was modified"

  - name: compress_ranges
    family: ranges
    split: train
    task: "Write a function `compress_ranges(nums: list[int]) -> str` that turns a list of integers into a compact range string: [1,2,3,5,7,8] -> '1-3,5,7-8'. The input may be unsorted and contain duplicates. A run of two consecutive numbers is also written as a range ('7-8'). An empty list gives an empty string."
    reference: |
      def compress_ranges(nums):
          values = sorted(set(nums))
          parts = []
          i = 0
          while i < len(values):
              j = i
              while j + 1 < len(values) and values[j + 1] == values[j] + 1:
                  j += 1
              parts.append(str(values[i]) if i == j else f"{values[i]}-{values[j]}")
              i = j + 1
          return ",".join(parts)
    tests:
      - "assert compress_ranges([1, 2, 3, 5, 7, 8]) == '1-3,5,7-8'"
      - "assert compress_ranges([5]) == '5'"
      - "assert compress_ranges([]) == ''"
      - "assert compress_ranges([3, 1, 2, 2, 10]) == '1-3,10'"
      - "assert compress_ranges([1, 3, 5]) == '1,3,5'"

  - name: expand_ranges
    family: ranges
    split: test
    task: "Write a function `expand_ranges(s: str) -> list[int]` that expands a compact range string into a sorted list of distinct integers: '1-3,5,7-8' -> [1,2,3,5,7,8]. Parts may be in any order and may overlap. An empty string gives an empty list. Raise ValueError for malformed parts such as 'a', '3-' or a descending range like '5-2'."
    reference: |
      import re

      def expand_ranges(s):
          if not s:
              return []
          out = set()
          for part in s.split(","):
              m = re.fullmatch(r"(\d+)(?:-(\d+))?", part.strip())
              if m is None:
                  raise ValueError(f"malformed part: {part!r}")
              lo = int(m.group(1))
              hi = int(m.group(2)) if m.group(2) else lo
              if hi < lo:
                  raise ValueError(f"descending range: {part!r}")
              out.update(range(lo, hi + 1))
          return sorted(out)
    tests:
      - "assert expand_ranges('1-3,5,7-8') == [1, 2, 3, 5, 7, 8]"
      - "assert expand_ranges('5') == [5]"
      - "assert expand_ranges('') == []"
      - "assert expand_ranges('7-8,1-3,2-4') == [1, 2, 3, 4, 7, 8]"
      - |
        try:
            expand_ranges('5-2')
            raise AssertionError("expected ValueError for descending range")
        except ValueError:
            pass
      - |
        try:
            expand_ranges('1,a')
            raise AssertionError("expected ValueError for 'a'")
        except ValueError:
            pass

  - name: missing_ranges
    family: ranges
    split: test
    task: "Write a function `missing_ranges(nums: list[int], lo: int, hi: int) -> list[list[int]]` that returns the closed intervals of integers in [lo, hi] that do not appear in nums, sorted by start. nums may be unsorted, contain duplicates and contain values outside [lo, hi]. missing_ranges([0, 1, 3, 50, 75], 0, 99) is [[2, 2], [4, 49], [51, 74], [76, 99]]. If nothing is missing return an empty list."
    reference: |
      def missing_ranges(nums, lo, hi):
          result = []
          nxt = lo
          for n in sorted(set(nums)):
              if n < lo or n > hi:
                  continue
              if n > nxt:
                  result.append([nxt, n - 1])
              nxt = n + 1
          if nxt <= hi:
              result.append([nxt, hi])
          return result
    tests:
      - "assert missing_ranges([0, 1, 3, 50, 75], 0, 99) == [[2, 2], [4, 49], [51, 74], [76, 99]]"
      - "assert missing_ranges([], 1, 3) == [[1, 3]]"
      - "assert missing_ranges([1, 2, 3], 1, 3) == []"
      - "assert missing_ranges([3, 1, 1, 9, -4], 1, 5) == [[2, 2], [4, 5]]"
      - "assert missing_ranges([5], 5, 5) == []"
